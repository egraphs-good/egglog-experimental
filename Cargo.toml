[package]
name = "egglog-experimental"
version = "3.0.0"
edition = "2024"
description = "Experimental extensions to the egglog language."
repository = "https://github.com/egraphs-good/egglog-experimental"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"

[workspace]
members = ["typed-macros"]
resolver = "3"

[[test]]
harness = false
name = "files"

[[bin]]
name = "egglog-experimental"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = ["bin"]
bin = ["egglog/bin"]
typed = ["dep:egglog-experimental-typed-macros"]
serde = ["egglog/serde"]
graphviz = ["egglog/graphviz"]

[dependencies]
egglog = { version = "3.0.0", git = "https://github.com/saulshanabrook/egg-smol", rev = "b061d1f41398747fb39f6e186a682e8e2d758ceb", default-features = false }
egglog-ast = { version = "3.0.0", git = "https://github.com/saulshanabrook/egg-smol", rev = "b061d1f41398747fb39f6e186a682e8e2d758ceb", default-features = false }
egglog-reports = { version = "3.0.0", git = "https://github.com/saulshanabrook/egg-smol", rev = "b061d1f41398747fb39f6e186a682e8e2d758ceb", default-features = false }

num = "0.4.3"
lazy_static = "1.4"
log = "0.4"
fixedbitset = "0.5.7"
# Greedy-DAG's hot maps were 1.90% faster than std on the Taylor 51 canary.
hashbrown = "0.16.0"
egglog-experimental-typed-macros = { path = "typed-macros", version = "3.0.0", optional = true }

[dev-dependencies]
glob = "0.3.1"
libtest-mimic = "0.8.1"
trybuild = "1"

