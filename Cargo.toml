[package]
name = "egglog-experimental"
version = "0.1.0"
edition = "2024"
description = "Experimental extensions to the egglog language."
repository = "https://github.com/egraphs-good/egglog-experimental"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"

[[test]]
harness = false
name = "files"

[features]
default = ["bin"]
bin = ["egglog/bin"]

[dependencies]
# TODO: re-pin to egraphs-good/egglog once https://github.com/egraphs-good/egglog/pull/1003
# lands. `unstable-subst` needs the `pop` fix on that branch; without it, walking the
# tables after a `pop` hands the backend a table id it no longer has.
egglog = { git = "https://github.com/oflatt-claude/egglog.git", rev = "67d32a5f3dd77498aa2e4159bae8bdeadded7464", default-features = false }
egglog-ast = { git = "https://github.com/oflatt-claude/egglog.git", rev = "67d32a5f3dd77498aa2e4159bae8bdeadded7464", default-features = false }
egglog-reports = { git = "https://github.com/oflatt-claude/egglog.git", rev = "67d32a5f3dd77498aa2e4159bae8bdeadded7464", default-features = false }

num = "0.4.3"
lazy_static = "1.4"
log = "0.4"

[dev-dependencies]
glob = "0.3.1"
libtest-mimic = "0.8.1"
