[package]
name = "egglog-experimental"
version = "0.1.0"
edition = "2024"
description = "Experimental extensions to the egglog language."
repository = "https://github.com/egraphs-good/egglog-experimental"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"

[[test]]
harness = false
name = "files"

[features]
default = ["bin"]
bin = ["egglog/bin"]

[dependencies]
# Points at egraphs-good/egglog#986, which adds the e-graph introspection
# `unstable-subst` is built on (Read::enodes_for_eclass, Read::table_schema /
# table_subtype, Core::rebuild_container). Move back to an egraphs-good rev once
# that PR merges.
egglog = { git = "https://github.com/oflatt-claude/egglog.git", rev = "f3e3a855d6c5907252de6fc1b8af90776beb49f4", default-features = false }
egglog-ast = { git = "https://github.com/oflatt-claude/egglog.git", rev = "f3e3a855d6c5907252de6fc1b8af90776beb49f4", default-features = false }
egglog-reports = { git = "https://github.com/oflatt-claude/egglog.git", rev = "f3e3a855d6c5907252de6fc1b8af90776beb49f4", default-features = false }

num = "0.4.3"
lazy_static = "1.4"
log = "0.4"

[dev-dependencies]
glob = "0.3.1"
libtest-mimic = "0.8.1"
