[package]
name = "egglog-experimental"
version = "0.1.0"
edition = "2024"
description = "Experimental extensions to the egglog language."
repository = "https://github.com/egraphs-good/egglog-experimental"
keywords = ["e-graphs", "egglog", "datalog", "compiler", "equality"]
license = "MIT"
readme = "README.md"

[[test]]
harness = false
name = "files"

[features]
default = ["bin"]
bin = ["egglog/bin"]

[dependencies]
# Local override while the egglog side of `unstable-subst` (Read::enodes_for_eclass,
# Read::table_schema / table_subtype, Core::rebuild_container) is unmerged. Revert to
# the git rev once it lands upstream.
egglog = { path = "/home/oflatt/egglog-subst/.claude/worktrees/subst-primitive", default-features = false }
egglog-ast = { path = "/home/oflatt/egglog-subst/.claude/worktrees/subst-primitive/egglog-ast", default-features = false }
egglog-reports = { path = "/home/oflatt/egglog-subst/.claude/worktrees/subst-primitive/egglog-reports", default-features = false }

num = "0.4.3"
lazy_static = "1.4"
log = "0.4"

[dev-dependencies]
glob = "0.3.1"
libtest-mimic = "0.8.1"
