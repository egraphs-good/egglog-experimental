syntax = "proto3";

package egglog.v1;

import "buf/validate/validate.proto";

// Draft proposed v1 of a typed, language-neutral Egglog IR, with generated
// Rust/Python messages. This draft uses ir_version = 1;
// receivers must reject unsupported versions. Overview: proto/README.md.
// Every arena index must name an existing entry in its enclosing program,
// or response. CEL checks the direct node/sort edges below; other
// references, including roots in commands and outputs, remain normative.
// A fact is a bare node index; equality is a `Union` node, so `(= a b)` is a
// fact naming a union of a and b.
// Validation rules and normative comments in this file are the specification.
// Unknown versions/enums are errors; Rust consumers must check raw enum values.
// Producers expand datatype/default-argument/include syntax before this boundary.
// No scope stack: clone an e-graph to save state, including its proof state.

// ---------------------------------------------------------------------------
// PROGRAM AND PROVENANCE — the request payload and the shared span vocabulary.
// ---------------------------------------------------------------------------

// A typed program against one e-graph handle. CEL rules are executable reference
// predicates; evaluators may exhaust their budgets on large valid inputs.
// Implementations may enforce equivalent checks in a scalable verifier. Budget
// exhaustion is inconclusive, not validity or invalidity. A verifier must also
// check remaining bounds, types, binding, groundedness, arity, and declarations.
// Sorts are acyclic; expression cycles must pass through a `Union` node.
// Install all declarations and named ruleset bindings before commands,
// order-independently and without executing their bodies.
// Definitions installed on this handle may be referenced by name without
// resending them. Node, sort, rule and ruleset indices refer to this Program's
// arenas, not previous requests; all referenced entries must be included here.
// Execute only commands, in order, and the expressions they demand. Unused
// arena entries are not executed; arena membership is not an execution root.
// Direct Actions in one execution of a command list share a Union identity
// scope, even across intervening non-Action commands. Program.commands is one
// such list. Each loop-body iteration starts an independent scope; nested lists
// never inherit the outer mapping, which resumes after they return. Rule
// firings and other commands' evaluated inputs have their own scopes as in Union.
// Sort.var is legal only in HostPrimitive signatures and their presentation
// owner/trait patterns, sharing that signature's binder. Node sorts, lambda
// parameter sorts, cost sorts and concrete declaration signatures must be
// recursively closed. CEL rejects direct variable roots; closure is normative.
message Program {
  option (buf.validate.message).cel = {
    id: "program.node_sort_in_range"
    message: "every node sort_id must index a non-variable sort"
    expression:
      "this.nodes.all(n, n.sort_id < uint(size(this.sorts)) && "
      "!has(this.sorts[int(n.sort_id)].var))"
  };
  option (buf.validate.message).cel = {
    id: "program.node_refs_in_range"
    message: "node children must index nodes"
    expression:
      "this.nodes.all(n, "
      "(has(n.call) ? n.call.args : "
      "has(n.get_cost) ? n.get_cost.args : "
      "has(n.union) ? n.union.members : "
      "has(n.primitive_value) ? [n.primitive_value].map(v, "
      "has(v.lambda) ? v.lambda.captures + [v.lambda.body] : "
      "has(v.partial_call) ? v.partial_call.args : "
      "has(v.vec) ? v.vec.items : has(v.set) ? v.set.items : "
      "has(v.multiset) ? v.multiset.items : "
      "has(v.map) ? v.map.entries.map(e, e.key) + v.map.entries.map(e, e.value) : "
      "has(v.pair) ? [v.pair.first, v.pair.second] : "
      "has(v.maybe) && has(v.maybe.value) ? [v.maybe.value] : "
      "has(v.custom) ? v.custom.args : [])[0] : [])"
      ".all(i, i < uint(size(this.nodes))))"
  };
  option (buf.validate.message).cel = {
    id: "program.sort_refs_in_range"
    message: "sort children must index sorts"
    expression:
      "this.sorts.all(s, "
      "(has(s.family) ? s.family.args : "
      "has(s.func) ? s.func.params + [s.func.result] : [])"
      ".all(i, i < uint(size(this.sorts))))"
  };
  option (buf.validate.message).cel = {
    id: "program.concrete_signature_roots"
    message: "concrete declaration signatures must index non-variable sorts"
    expression:
      "this.declarations.all(d, "
      "(has(d.constructor) ? d.constructor.inputs.map(a, a.sort) + [d.constructor.output] : "
      "has(d.function) ? d.function.inputs.map(a, a.sort) + [d.function.output] : "
      "has(d.relation) ? d.relation.inputs.map(a, a.sort) : "
      "has(d.primitive) ? d.primitive.inputs.map(a, a.sort) + [d.primitive.output] : [])"
      ".all(i, i < uint(size(this.sorts)) && !has(this.sorts[int(i)].var)))"
  };
  option (buf.validate.message).cel = {
    id: "program.function_value_signature"
    message: "function values require a function sort with non-variable parameter/result roots"
    expression:
      "this.nodes.all(n, !(has(n.primitive_value.lambda) || has(n.primitive_value.partial_call)) || "
      "(n.sort_id < uint(size(this.sorts)) && has(this.sorts[int(n.sort_id)].func) && "
      "[this.sorts[int(n.sort_id)].func].all(f, (f.params + [f.result]).all(i, "
      "i < uint(size(this.sorts)) && !has(this.sorts[int(i)].var)))))"
  };
  // Bounds and direct variable roots only; follow nested patterns with the
  // enclosing signature's binder in the semantic verifier.
  option (buf.validate.message).cel = {
    id: "program.generic_signature_roots"
    message: "signature sorts must exist and direct variables must be bound"
    expression:
      "this.declarations.all(d, !has(d.host_primitive) || "
      "!has(d.host_primitive.signature) || [d.host_primitive.signature].all(sig, "
      "(sig.inputs.map(a, a.sort) + (has(sig.output) ? [sig.output] : []) + "
      "sig.varargs.map(a, a.sort)).all(i, "
      "i < uint(size(this.sorts)) && (!has(this.sorts[int(i)].var) || "
      "this.sorts[int(i)].var < uint(size(sig.type_params))))))"
  };
  option (buf.validate.message).cel = {
    id: "program.bindings_default_roots"
    message: "presentation defaults must index nodes and cannot be free variable roots"
    expression:
      "this.declarations.all(d, !has(d.bindings) || d.bindings.python.views.all(v, "
      "v.params.all(p, !has(p.default_expr) || (p.default_expr < uint(size(this.nodes)) && "
      "!has(this.nodes[int(p.default_expr)].var)))))"
  };
  option (buf.validate.message).cel = {
    id: "program.bindings_sort_roots"
    message: "presentation sort references must exist and direct variables use the callable binder"
    expression:
      "this.declarations.all(d, !has(d.bindings) || "
      "[has(d.host_primitive) && has(d.host_primitive.signature) ? "
      "size(d.host_primitive.signature.type_params) : 0].all(n, "
      "d.bindings.python.views.all(v, "
      "(!has(v.owner) || !has(v.owner.sort)) || [v.owner.sort].all(i, "
      "i < uint(size(this.sorts)) && (!has(this.sorts[int(i)].var) || this.sorts[int(i)].var < uint(n)))) && "
      "d.bindings.rust.views.all(v, ((has(v.owner) && has(v.owner.sort) ? [v.owner.sort] : []) + "
      "(has(v.trait_impl) ? v.trait_impl.args.map(a, a.sort) : [])).all(i, "
      "i < uint(size(this.sorts)) && (!has(this.sorts[int(i)].var) || this.sorts[int(i)].var < uint(n))))))"
  };
  // Nominal equality sorts and host families have distinct name spaces.
  // Same-family resends must agree on arity even without an arena use.
  option (buf.validate.message).cel = {
    id: "program.sort_declarations"
    message: "same-name host-family declarations must agree on arity"
    expression:
      "this.declarations.all(d, !has(d.host_sort_family) || "
      "this.declarations.all(e, !has(e.host_sort_family) || "
      "d.host_sort_family.name != e.host_sort_family.name || "
      "d.host_sort_family.arity == e.host_sort_family.arity))"
  };
  // Ambient/installed resolution remains normative. Check local declarations
  // against direct references/applications, including signature patterns.
  option (buf.validate.message).cel = {
    id: "program.sort_uses"
    message: "host-family applications must agree with declared family arities"
    expression:
      "this.declarations.all(d, !has(d.host_sort_family) || "
      "this.sorts.all(s, !has(s.family) || s.family.name != d.host_sort_family.name || "
      "uint(size(s.family.args)) == d.host_sort_family.arity))"
  };
  option (buf.validate.message).cel = {
    id: "program.empty_union_eq_sort"
    message: "an empty union requires an equality sort"
    expression:
      "this.nodes.all(n, !has(n.union) || size(n.union.members) > 0 || "
      "(n.sort_id < uint(size(this.sorts)) && has(this.sorts[int(n.sort_id)].eq)))"
  };
  option (buf.validate.message).cel = {
    id: "program.constructor_cost_in_range"
    message: "declared constructor costs must index nodes"
    expression:
      "this.declarations.all(d, !has(d.constructor) || "
      "!has(d.constructor.cost) || d.constructor.cost < uint(size(this.nodes)))"
  };
  // Direct composition edges only. Name resolution, composition cycles, Run
  // references (including nested commands) and retained occurrence matching
  // remain normative, not established by this nonrecursive CEL rule.
  option (buf.validate.message).cel = {
    id: "program.ruleset_refs_in_range"
    message: "composition indices must index rulesets"
    expression:
      "this.rulesets.all(r, !has(r.combined) || "
      "r.combined.rulesets.all(ref, !has(ref.index) || "
      "ref.index < uint(size(this.rulesets))))"
  };
  option (buf.validate.message).cel = {
    id: "program.rule_refs_in_range"
    message: "rule-list indices must index the rule arena"
    expression:
      "this.rulesets.all(s, !has(s.rules) || "
      "s.rules.rules.all(i, i < uint(size(this.rules))))"
  };
  // Direct rule roots only; binding, typing, effects and occurrence matching
  // remain normative. Node-child bounds are checked separately above.
  option (buf.validate.message).cel = {
    id: "program.rule_node_refs_in_range"
    message: "rule query, head and rewrite roots must index nodes"
    expression:
      "this.rules.all(r, "
      "(has(r.rule) ? r.rule.query : "
      "has(r.rewrite) ? [r.rewrite.lhs, r.rewrite.rhs] + r.rewrite.conditions : "
      "has(r.birewrite) ? [r.birewrite.lhs, r.birewrite.rhs] + r.birewrite.conditions : [])"
      ".all(i, i < uint(size(this.nodes))) && "
      "(!has(r.rule) || r.rule.head.all(a, "
      "(has(a.term) ? [a.term] : "
      "has(a.set) ? a.set.target.args + [a.set.value] : "
      "has(a.delete) ? a.delete.args : "
      "has(a.subsume) ? a.subsume.args : "
      "has(a.set_cost) ? a.set_cost.target.args + [a.set_cost.cost] : [])"
      ".all(i, i < uint(size(this.nodes))))))"
  };
  // Reject relation children with matching argument sort IDs and Unit result.
  // Structural-sort equivalence and complete declared/ambient resolution
  // remain normative: different IDs for equivalent sorts can escape this rule.
  option (buf.validate.message).cel = {
    id: "program.relation_children"
    message: "a declared relation call cannot be a value child"
    expression:
      "this.nodes.all(n, "
      "(has(n.call) ? n.call.args : "
      "has(n.get_cost) ? n.get_cost.args : "
      "has(n.union) ? n.union.members : "
      "has(n.primitive_value) ? [n.primitive_value].map(v, "
      "has(v.lambda) ? v.lambda.captures + [v.lambda.body] : "
      "has(v.partial_call) ? v.partial_call.args : "
      "has(v.vec) ? v.vec.items : has(v.set) ? v.set.items : "
      "has(v.multiset) ? v.multiset.items : "
      "has(v.map) ? v.map.entries.map(e, e.key) + v.map.entries.map(e, e.value) : "
      "has(v.pair) ? [v.pair.first, v.pair.second] : "
      "has(v.maybe) && has(v.maybe.value) ? [v.maybe.value] : "
      "has(v.custom) ? v.custom.args : [])[0] : [])"
      ".all(i, i < uint(size(this.nodes)) && "
      "(!has(this.nodes[int(i)].call) || "
      "this.nodes[int(i)].sort_id >= uint(size(this.sorts)) || "
      "!has(this.sorts[int(this.nodes[int(i)].sort_id)].family) || "
      "this.sorts[int(this.nodes[int(i)].sort_id)].family.name != 'Unit' || "
      "size(this.sorts[int(this.nodes[int(i)].sort_id)].family.args) != 0 || "
      "!this.nodes[int(i)].call.args.all(a, a < uint(size(this.nodes))) || "
      "!this.declarations.exists(d, has(d.relation) && "
      "d.relation.name == this.nodes[int(i)].call.func && "
      "d.relation.inputs.map(a, a.sort) == "
      "this.nodes[int(i)].call.args.map(a, this.nodes[int(a)].sort_id)))))"
  };

  // This draft's IR version is 1. Reject unsupported values rather than
  // decoding and re-emitting them; the field constraint only rejects zero.
  uint32 ir_version = 1 [(buf.validate.field).uint32.gt = 0];

  // Expression arena. Ordinary expression nodes are shared syntax, not cached
  // values: reusing their indices neither binds a value nor constrains how often
  // they are evaluated. Their sharing is optional. `Union` locations instead
  // identify class groups; see `Union`.
  repeated Node nodes = 2;

  // Sort arena, separate from expression nodes.
  repeated Sort sorts = 3;

  repeated Declaration declarations = 4;

  repeated Command commands = 5;

  // Optional provenance. Omit spans for a normalized/unlocated program.
  repeated SourceFile files = 6;

  // Ruleset occurrences, shared by index within this submission. Named roots
  // retain their reachable occurrences; see Ruleset for cross-request reuse.
  repeated Ruleset rulesets = 7;

  // Rule occurrences, shared across rule lists by index. Equal entries remain
  // distinct occurrences; labels never identify them. Unused entries do not
  // execute. Only named ruleset roots retain reachable rules across requests;
  // other rules are request-local and omitted by Freeze.
  repeated RuleDecl rules = 9;
}

// Source metadata supports diagnostic locations and documentation, not
// arbitrary comment attachment, formatting or source round-tripping.
// A source file shared by spans in the enclosing payload.
message SourceFile {
  string name = 1;
  // Optional contents for diagnostic excerpts when the source is unavailable.
  // In-process consumers may use name as a file path.
  optional string contents = 2;
}

// A byte range. Resolve `file` against the nearest arena-owning payload's
// `files`: `Program`, `CreateEGraphRequest`, `RunProgramResponse`, or
// a nested exported `Program`. Re-emission must remap or include those files,
// or strip spans, including origins from definitions installed by earlier requests;
// dangling indices are invalid. The range is half-open [start, end), with
// start <= end. If contents are present, both offsets must be UTF-8 character
// boundaries within their byte length, including for an explicitly empty
// source. File bounds, content length and character boundaries are normative.
message Span {
  option (buf.validate.message).cel = {
    id: "span.ordered_range"
    message: "span start must not exceed end"
    expression: "this.start <= this.end"
  };

  uint32 file = 1; // index into the enclosing message's `files`
  uint32 start = 2; // byte offset
  uint32 end = 3; // byte offset
}

// ---------------------------------------------------------------------------
// SORTS — shared concrete types and signature patterns.
// ---------------------------------------------------------------------------

// Closed types are structurally interned. Equal container/function shapes
// denote the same sort.
// Signatures and their presentation patterns reuse binder-local variables.
// A shared pattern is interpreted independently in each GenericSignature;
// arena sharing never shares substitutions between signatures or calls.
// Sorts are acyclic through HostSort.args and FuncSort.params/result. CEL
// checks direct indices, not acyclicity or recursive variable scope.
// References do not declare sorts: resolve equality names and host families
// against local declarations, installed definitions or ambient host definitions
// in their respective namespaces: eq only resolves EqSort, family only resolves
// HostSortFamily. Equal name spellings do not identify or substitute these kinds.
// Missing names and family-arity mismatches are errors. Builtin references do
// not require explicit descriptor declarations. Response references resolve
// against the associated handle; their arenas do not redeclare definitions.
message Sort {
  oneof kind {
    option (buf.validate.oneof).required = true;

    string eq = 1 [(buf.validate.field).string.min_len = 1];
    HostSort family = 2;
    FuncSort func = 4;
    uint32 var = 7; // index into the enclosing GenericSignature.type_params
  }

  // Optional representative type-use origin; excluded from sort identity.
  // Documentation and language bindings belong to the defining Declaration.
  Span span = 5;
}

// A host-family application: no args for i64/Unit, or e.g. Vec<i64> and
// Map<String, Math>. Arg count equals declared family arity, including zero.
// Args may be patterns only in a GenericSignature or its bindings; otherwise
// recursively closed. Host-family sorts are not equality sorts.
message HostSort {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated uint32 args = 2 [packed = true]; // index into the enclosing `sorts`
}

// A structural function type, not a named host sort family. Its parameter and
// result sorts may be patterns in a GenericSignature or its presentation;
// otherwise closed.
message FuncSort {
  repeated uint32 params = 1 [packed = true]; // index into the enclosing `sorts`
  uint32 result = 2; // index into the enclosing `sorts`
}

// ---------------------------------------------------------------------------
// EXPRESSIONS — the node arena, `Union`, and the other `Node.kind` payloads.
// ---------------------------------------------------------------------------

// Typed syntax. The producer supplies the resolved sort; the verifier checks
// it against the value payload, binding, or callable signature.
//
// USE CONTEXT IS NORMATIVE. Every use must be valid independently, even when
// one node is shared between code and data. The contexts are query, action,
// deferred code, and inert value data:
// Rule queries, rewrite LHSs/conditions, checks, and loop-until facts are queries.
// Rule heads, rewrite RHSs, top-level actions, and operations' evaluated inputs
// use the action context.
// - Queries share one binder across all facts. Rule heads and rewrite RHSs
//   may use names bound by that query; top-level evaluated inputs have no
//   free variables. Every variable must belong to its use's binder.
// - Function merges, primitives, and lambda bodies use only their own binders
//   (see those messages). At every use, the body and its transitive callees
//   must be legal in that execution context. Hosts publish the capabilities
//   of ambient primitives; receivers check these obligations. A Union in an
//   evaluated body can write, even though the body contains only expressions.
// - Presentation defaults are closed symbolic templates, not evaluated at
//   installation/export. Lambda bodies keep their own binders; every expanded
//   use must satisfy its ordinary execution context's typing/effect rules.
// - Inert values (declared costs and extracted data) contain no variables,
//   get_cost reads or Union and must be finite. Saved code bodies retain
//   their own binders, so these are use-site rules, not bans on an entire arena.
// Scalar values are inert. Child-bearing values follow the surrounding
// context; constructing a value does not grant inverse query matching or
// relax groundedness. Calls and host value materialization must obey their
// enclosing execution context's capabilities, including query-mode restrictions.
//
// Call/get_cost arguments, Union members and PrimitiveValue children inherit
// the surrounding context and binder. Each is a value position: a row position
// never propagates to children. A lambda body starts its own code
// context and binder, also in a value position. See Call for relation rows.
// CEL does not propagate these contexts or check binding and effects.
message Node {
  uint32 sort_id = 1; // index into the enclosing `sorts`

  oneof kind {
    option (buf.validate.oneof).required = true;

    // A variable name. Generated names must be deterministic and fresh across
    // the whole binder, avoiding user names and the positional
    // lambda/primitive parameters _0, _1, ....
    string var = 2 [(buf.validate.field).string.min_len = 1];
    PrimitiveValue primitive_value = 3;
    Call call = 4;

    // An explicit identity-bearing class/equality group. See `Union`.
    Union union = 7;

    // Read a Constructor row's explicitly assigned per-row cost, yielding C.
    // The target addresses the row without evaluating/inserting the constructor.
    // Functions, Relations and primitives are invalid targets. No declared-cost
    // or model fallback occurs; assigned zero differs from absent annotation.
    // In queries this is a relational pattern over assigned costs: key variables
    // may bind in the query binder; an absent annotation contributes no match.
    // It has seminaive dependencies like a table lookup, not a Pure-only primitive.
    // When evaluated, evaluate args once each, left-to-right, then read the cost;
    // absence fails with EVALUATION_FAILED. This requires a read-capable context,
    // so is invalid in SEMINAIVE heads or Pure/Write code. Args inherit the use's
    // context/binder. Not inert data; saved code may use it under these rules.
    Call get_cost = 9;
  }

  // One optional origin. Producers may share ordinary syntax with one chosen
  // location or emit separate nodes for distinct locations, sharing children.
  // Do not duplicate identity-bearing Union locations merely to attach spans.
  // Spans never participate in a row's key.
  Span span = 8;
}

// A class/equality group. The node's INDEX identifies its occurrence; the
// enclosing `sort_id` is the group's sort.
//
// Member roles follow from the callee's declaration, never from position:
//   constructor call    an extraction alternative when stored in this class
//   function call       a lookup whose result participates in the equality
//   primitive value     an exact concrete value participating in the equality
// A function call member is never an extraction alternative.
//
// Exports write function rows with Set, including Unit-returning functions;
// they do not evaluate function Call members to recreate missing rows.
// Relation rows are inserted with a bare Call, never a Union member.
//
// MEANING DEPENDS ON POSITION, and the position PROPAGATES into nested
// expressions — a union may be an argument, as in `f(Union[a, b])`:
//   fact      a and b match the same value; `f` then matches using it. This is
//             `(= a b)`. NEVER mutates.
//   action    merge a and b's classes, then pass the resulting class to `f`.
//             Equality sorts only; a base sort needs the directional `Set`.
// Union is a value node, not restricted to a standalone action. Top-level
// input uses the action context only when a command demands its evaluation.
// Nesting does not permit reordering around reads, effects or row conflicts.
//
// An empty union allocates a fresh equality class in an ACTION context,
// including as a call argument; no temporary constructor row is needed.
// Every empty union requires an equality sort. Queries require a nonempty
// union; actions require an equality sort even when nonempty. Nonempty
// primitive-sort unions are permitted in queries. Extracted
// data forbids unions; deferred code obeys its execution context as in Node.
//
// During one rule firing, a Union location identifies one class across the
// whole ordered head. Direct Actions in an executed command list share one
// unit as specified on Program; each loop iteration uses a fresh unit.
// Each primitive/lambda invocation starts a fresh unit. All evaluated inputs
// of another command share one independent unit for that command execution.
// On first action use, establish the class identity before evaluating members;
// references and backedges reuse it without reevaluating those members. Later
// units may allocate fresh classes. Retained mappings follow canonical class
// identity through intervening unions, rebuilds and Runs. Queries, including
// Check and loop-until facts, neither read nor populate this evaluation mapping;
// they remain nonallocating constraints.
// This identity rule does not memoize ordinary calls.
//
// CANONICALIZATION MAY IDENTIFY DISTINCT LOCATIONS. A row belongs to exactly
// one class, so two groups that share a member denote the SAME class afterwards —
// `Union[Num(0), A]` and `Union[Num(0), B]` are one class containing `Num(0)`,
// `A` and `B`. Distinct indices are distinct groups only when nothing forces
// them together; two EMPTY unions share no member and stay separate classes.
//
// A ROW IS ITS KEY, not its node. The same callable with the same arguments is
// ONE table row however many arena entries spell it, so two structurally equal
// call nodes cannot be subsumed independently.
//
// CYCLES. An equality-sort constructor argument can reference a class, so a
// class can reach itself:
//
//   0: Math  Union[2, 3]     the class c
//   1: i64   PrimitiveValue.i64(0)
//   2: Math  Num(1)
//   3: Math  Add(0, 0)       both args are class 0
//
// That spells `c = Num(0) | Add(c, c)`. The cycle is in the graph, not the
// messages: node 3 stores the integers 0 and 0. Consumers MUST walk with a
// visited set.
//
// NORMATIVE: a cycle MUST pass through a union node. Removing Union's outgoing
// edges must leave an acyclic graph of Call/get_cost arguments and every
// PrimitiveValue child, including custom args and lambda bodies/captures.
// Union members still obey their inherited use context and bounds.
// A call reaching itself with no class boundary is invalid, not a recursive
// value. These cycle rules are not enforced by CEL.
//
// NEVER HASH-CONSED. A producer MUST append union nodes positionally and MUST
// NOT route them through a node-sharing or dedup path: two empty unions of the
// same sort are different classes, and the distinction is unrecoverable
// afterwards.
message Union {
  repeated uint32 members = 1 [packed = true]; // index into the enclosing `nodes`
}

// A callable name and positional arguments. The enclosing field determines
// whether it is an application, row address, cost read, or partial application.
// The callable is declared in the enclosing payload,
// already installed on the handle, or implicitly provided by the host.
// The name identifies one callable across installed and ambient definitions;
// there are no same-name overload sets. Check argument and result sorts against
// that definition's signature. Generic instantiation does not select another
// definition. Frontends resolve overloaded surface syntax and conversions
// before this boundary. Missing names and signature mismatches are errors.
// HostPrimitive's typing form checks all concrete argument AND result sorts;
// every generic parameter must be determined. There are no call-level type args.
//
// For Node.call, the enclosing node's sort matches the result; relation calls
// use Unit. Relation calls are restricted to row positions: a query fact,
// `Action.term`, or `Action.delete`. They cannot be value
// arguments, `Set.value`, `Union` members, lambda captures/results, or deferred code.
// The restriction applies to installed and ambient names as well as local
// declarations. A relation row is the bare `Call` node itself; see `Union`
// for the Unit-sorted row rule.
message Call {
  string func = 1 [(buf.validate.field).string.min_len = 1];
  repeated uint32 args = 2 [packed = true]; // index into the enclosing `nodes`
}

// A closed function body with explicit captures. Body variables are _0, _1,
// ...: captures first, then parameters. Nested lambdas capture explicitly.
// The enclosing node has a concrete FuncSort, which supplies parameter sorts
// and the required body result sort; the Lambda does not repeat that signature.
// The body cannot use the surrounding binder: its complete binder is _0
// through _(captures.size + FuncSort.params.size - 1), empty when that sum is zero.
// Captures inherit the surrounding use context, including its data restrictions;
// the body is separately scoped deferred code, even in a stored/extracted value.
// Function values use PrimitiveValue.lambda; application remains a Call.
// Node sharing does not determine function-value equality.
message Lambda {
  // Evaluated when the lambda is constructed; bound as _0 through _(k-1).
  repeated uint32 captures = 1 [packed = true]; // index into the enclosing `nodes`
  uint32 body = 3; // index into the enclosing `nodes`
}

// Native values, selected and typed by the enclosing Node.sort_id. The five
// scalar arms retain their exact payloads: f64_bits preserves IEEE-754 bits,
// while Egglog equality identifies signed zeroes and all NaN bit patterns.
// BigInt/BigRat/Rational and vec/set/multiset/map/pair/maybe use their matching
// HostSort family applications; lambda/partial_call use FuncSort.
// CustomValue supports host sorts, including nullary families with value children.
// Verify payload/sort agreement and child types; CEL checks their indices only.
//
// Evaluated children run left-to-right in field/list order (map key then value
// per entry). Sets deduplicate; maps use the last value for an equal key.
// Exported/extracted value payloads encode semantic contents: Set elements and Map
// keys are unique, MultiSet repeats preserve multiplicity, and their enumeration
// order is unspecified. Vec/Pair order is significant. Query capabilities and
// groundedness are unchanged: query child inputs must be grounded; these
// payloads do not bind child variables by inverse matching.
// Lambda captures are constructed now and its body is separately scoped code.
// Symbolic operations such as rational(n,d), vec-of or function application
// remain Calls; they are not interchangeable with already-formed value data.
message PrimitiveValue {
  oneof value {
    option (buf.validate.oneof).required = true;

    int64 i64 = 1;
    fixed64 f64_bits = 2;
    string string = 3;
    bool bool = 4;
    Unit unit = 5;
    // Canonical signed decimal: no leading +/zeroes or negative zero.
    string big_int = 6 [(buf.validate.field).string.pattern = "^(0|-?[1-9][0-9]*)$"];
    BigRat big_rat = 7;
    Rational rational = 8;
    ValueList vec = 9;
    ValueList set = 10;
    ValueList multiset = 11;
    MapValue map = 12;
    PairValue pair = 13;
    MaybeValue maybe = 14;
    Lambda lambda = 15;
    // A function value with a named callable's argument prefix captured, never
    // a dynamic function value. The enclosing node has a closed FuncSort.
    // Concatenate captured arg sorts with its remaining params and use its result
    // to check one effective complete call under the callee's typing form,
    // including varargs or FunctionApplication. This must determine all generic
    // parameters, even with zero/all args captured. Relation partial application
    // remains a signature/capability question; captured args are value positions.
    Call partial_call = 16;
    CustomValue custom = 17;
  }
}

// Reduced fraction with arbitrary integer components in canonical decimal:
// no leading +/zeroes or negative zero; positive denominator; zero is 0/1.
// Coprimality is normative, not checked by CEL. Malformed value data is invalid;
// it does not request symbolic rational construction or its failure behavior.
message BigRat {
  option (buf.validate.message).cel = {
    id: "big_rat.canonical_zero"
    message: "zero must have denominator one"
    expression: "this.numerator != '0' || this.denominator == '1'"
  };

  string numerator = 1 [(buf.validate.field).string.pattern = "^(0|-?[1-9][0-9]*)$"];
  string denominator = 2 [(buf.validate.field).string.pattern = "^[1-9][0-9]*$"];
}

// Experimental Rational's reduced i64 fraction. The denominator is positive;
// zero is 0/1. Coprimality is normative. No reduction or numeric cast is implied.
message Rational {
  option (buf.validate.message).cel = {
    id: "rational.canonical_zero"
    message: "zero must have denominator one"
    expression: "this.numerator != 0 || this.denominator == 1"
  };

  int64 numerator = 1;
  int64 denominator = 2 [(buf.validate.field).int64.gt = 0];
}

// Ordered child slots for Vec, Set or MultiSet; the selected arm fixes semantics.
message ValueList {
  repeated uint32 items = 1 [packed = true]; // index into the enclosing `nodes`
}

message MapValue {
  repeated MapEntry entries = 1;
}

// An explicit key/value association; both fields are required and zero is valid.
message MapEntry {
  optional uint32 key = 1 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
  optional uint32 value = 2 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
}

message PairValue {
  optional uint32 first = 1 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
  optional uint32 second = 2 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
}

// Absent is None; present is Some, including a child at index zero.
message MaybeValue {
  optional uint32 value = 1; // index into the enclosing `nodes`
}

// For host sorts without a dedicated PrimitiveValue arm. The exact enclosing
// sort selects the codec and its valid arg arity/sorts; no separate type tag.
// A nullary family may still have value args (e.g. PyObject); these are not
// HostSort's type args and need not have the same arity.
// All Egglog references are explicit args. Payload bytes may refer to arg slots,
// never arena/class indices, engine Value IDs or raw process pointers. Traversal,
// rebuilding and remapping must rewrite args regardless of sort kind, without
// altering bytes or arg slots/order/multiplicity; generic sorting/dedup is invalid.
// Host equality uses payload plus canonical args, not necessarily byte equality.
// The codec reconstructs the native value preserving references and obeying
// the enclosing execution capabilities; trust is not an effect exemption.
// Code evaluates args in order. Generic transport, inspection and remapping
// never materialize/unpickle or invoke host Debug hooks. Opaque bytes/args may
// be retained without a codec; explicit trusted materialization, evaluation or
// Freeze encoding requires one or fails. This declares future host obligations,
// including reference-aware nullary-family rebuilding, not existing runtime support.
message CustomValue {
  bytes payload = 1;
  repeated uint32 args = 2 [packed = true]; // index into the enclosing `nodes`
}

// The single value of the Unit sort.
message Unit {}

// ---------------------------------------------------------------------------
// ACTIONS — mutations, usable in a rule head or as a command.
// ---------------------------------------------------------------------------

// An ordered mutation or expression evaluation. Sharing syntax does not bind
// or retain its result; there is no rule-local let form. Persistent top-level
// captures lower to nullary functions plus sets.
// Set, delete, subsume and SetCost are standalone actions, not value expressions.
// Execute action lists in order; each Set uses the function's conflict policy
// if that write conflicts. Rule matches and rebuilds have no global order here.
// Deliberate coverage limit: a read cannot be retained across later writes by
// node sharing; this draft has no local-let operation to express that sequence.
message Action {
  oneof kind {
    option (buf.validate.oneof).required = true;

    // Evaluate/materialize this expression, insert a relation row, or — when
    // it names a `Union` node — merge the group's members.
    uint32 term = 1; // index into the enclosing `nodes`

    // Write a function row. Directional, unlike the symmetric `Union`, and so
    // NOT subsumable into one: it chooses which row is written.
    Set set = 2;

    // Delete a Constructor, Function or Relation row without constructing it.
    // Deleting a constructor row also deletes its per-row cost annotation.
    Call delete = 3;

    // Subsume only a Constructor row without constructing it, retaining its
    // row and cost annotation. Function and Relation targets are invalid.
    Call subsume = 7;
    string panic = 4;
    SetCost set_cost = 5;
  }

  // Optional origin; omit for an unlocated program. When present, this is the
  // authoritative action location, since a shared node's span may be dropped
  // or merged. A located `panic` needs this span because it has no operand node.
  Span span = 6;
}

// Write a function row at this action's position, applying its merge on
// conflict. The target addresses a row without evaluating that lookup;
// the row need not already exist.
message Set {
  Call target = 1 [(buf.validate.field).required = true];
  optional uint32 value = 2 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
}

// Write one constructor row's extraction cost. Usable in rule heads.
//
// Names a row and a value, not a table: where the engine stores the cost is not
// part of this contract. The cost expression has the handle's immutable cost
// sort C, selected at creation. Whether a model consults declared costs, per-row
// costs, both or neither is the model's choice.
// Evaluate target arguments left-to-right, once each, then evaluate the target
// constructor lookup/insertion. Next evaluate cost and write it for that row.
// Sequential writes use merge-new: the new cost replaces the previous cost
// for that row. A canonicalization collision also keeps the incoming value;
// either cost may survive depending on conflict processing order. This is not
// global chronological last-write-wins: no timestamps order canonicalization
// or rule matches. Earlier effects persist if a later step fails. Only
// Constructor targets are valid; Functions, Relations and primitives have no
// per-row costs. Deleting a target row deletes its annotation as well.
message SetCost {
  Call target = 1 [(buf.validate.field).required = true];

  // An expression yielding a value of C, not necessarily a literal integer:
  // `(set-cost (Num x) (+ (* x 100) 5))`.
  optional uint32 cost = 2 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
}

// ---------------------------------------------------------------------------
// DECLARATIONS — immutable sort and callable definitions.
// ---------------------------------------------------------------------------

// Order-independent, immutable definitions. New names may be added. Resending
// a complete definition is optional and checks compatibility: identical
// definitions are no-ops; conflicting definitions are errors. User tables and
// computed primitives have complete, concrete definitions, not signature-only
// imports. Host descriptors instead assert an available compatible provider;
// they never install native code. Referencing an ambient definition by name
// does not require resending its descriptor.
// Compare referenced expression subgraphs structurally, not request-local
// indices. Provenance, argument labels and language bindings do not
// participate in semantic identity; bindings have their own resupply checks.
// Comparison must preserve Union sharing/identity topology; ordinary syntax
// sharing may differ. One empty Union reused twice is not two fresh Unions.
// Callable names are unique across Constructor, Function, Relation, Primitive
// and HostPrimitive, including ambient definitions. EqSort, HostSortFamily and
// callable names occupy three distinct namespaces, selected by existing kind
// tags. Equal spellings may coexist across namespaces. Compatible resends retain
// the definition; conflicts within a namespace never shadow definitions.
// Host descriptor compatibility compares family arity or primitive typing form
// and structural signature, including ordered binder positions. Parameter
// labels are diagnostic; alpha-renaming those labels is compatible.
// Native implementation, codec and execution-capability compatibility remain
// host obligations; descriptor equality alone does not establish them.
message Declaration {
  option (buf.validate.message).cel = {
    id: "declaration.callable_bindings"
    message: "sort bindings belong on EqSort or HostSortFamily"
    expression: "!(has(this.eq_sort) || has(this.host_sort_family)) || !has(this.bindings)"
  };
  option (buf.validate.message).cel = {
    id: "declaration.presentation_inputs"
    message: "surface mappings must cover fixed inputs and any final logical tail exactly once"
    expression:
      "!has(this.bindings) || "
      "[has(this.constructor) ? size(this.constructor.inputs) : "
      "has(this.function) ? size(this.function.inputs) : "
      "has(this.relation) ? size(this.relation.inputs) : "
      "has(this.primitive) ? size(this.primitive.inputs) : "
      "has(this.host_primitive.signature) ? size(this.host_primitive.signature.inputs) : "
      "has(this.host_primitive.application) ? 1 : 0].all(n, "
      "[has(this.host_primitive.application) || size(this.host_primitive.signature.varargs) > 0].all(t, "
      "this.bindings.python.views.all(v, "
      "size(v.params) + (has(v.receiver) ? 1 : 0) == n + (t ? 1 : 0) && "
      "(!has(v.receiver) || v.receiver < uint(n)) && "
      "(!has(v.mutates) || v.mutates < uint(n)) && "
      "v.params.all(p, p.core_input < uint(n + (t ? 1 : 0))) && "
      "(!t || (size(v.params) > 0 && v.params[size(v.params)-1].core_input == uint(n) && "
      "!has(v.params[size(v.params)-1].default_expr)))) && "
      "this.bindings.rust.views.all(v, "
      "size(v.params) + (has(v.receiver) ? 1 : 0) == n + (t ? 1 : 0) && "
      "(!has(v.receiver) || v.receiver.core_input < uint(n)) && "
      "v.params.all(p, p.core_input < uint(n + (t ? 1 : 0))) && "
      "(!t || (size(v.params) > 0 && v.params[size(v.params)-1].core_input == uint(n))))))"
  };
  option (buf.validate.message).cel = {
    id: "declaration.constant_signature"
    message: "constant views require a concrete signature without generic parameters"
    expression:
      "!has(this.bindings) || this.bindings.python.views.all(v, v.kind != 7 || "
      "(!has(this.host_primitive) || (has(this.host_primitive.signature) && "
      "size(this.host_primitive.signature.type_params) == 0)))"
  };
  option (buf.validate.message).cel = {
    id: "declaration.presentation_special_forms"
    message: "function-wrapper owners require application receiver zero; datatype members require constructors"
    expression:
      "!has(this.bindings) || ("
      "this.bindings.python.views.all(v, !has(v.owner.function) || "
      "(has(this.host_primitive.application) && has(v.receiver) && v.receiver == uint(0))) && "
      "this.bindings.rust.views.all(v, !has(v.owner.function) || "
      "(has(this.host_primitive.application) && has(v.receiver) && v.receiver.core_input == uint(0))) && "
      "this.bindings.egglog.views.all(v, !v.datatype_member || has(this.constructor)))"
  };

  oneof kind {
    option (buf.validate.oneof).required = true;

    Constructor constructor = 1;
    Function function = 2;
    Relation relation = 3;
    Primitive primitive = 4;
    HostSortFamily host_sort_family = 5;
    HostPrimitive host_primitive = 6;
    EqSort eq_sort = 10;
  }

  // Optional diagnostic origin; excluded from semantic identity.
  Span span = 7;

  CallableBindings bindings = 8;

  // Optional documentation; excluded from semantic identity. Absent and
  // explicitly empty documentation remain distinct.
  optional string doc = 9;
}

// An argument's sort and optional label. Calls are positional; labels are not
// part of declaration identity.
message Arg {
  uint32 sort = 1; // index into the enclosing `sorts`
  string name = 2;
}

// A concrete nullary equality-sort definition. Its nominal namespace is distinct
// from host families and callables; same-name compatible resends are idempotent.
// Bindings have SortBindings' separate first-supply/resupply contract.
message EqSort {
  option (buf.validate.message).cel = {
    id: "eq_sort.presentation_parameters"
    message: "a nullary equality sort has no presentation type parameters"
    expression:
      "!has(this.bindings) || "
      "(size(this.bindings.python.type_params) == 0 && size(this.bindings.rust.type_params) == 0)"
  };

  string name = 1 [(buf.validate.field).string.min_len = 1];
  SortBindings bindings = 2;
}

// A concrete constructor whose output is an equality sort.
message Constructor {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated Arg inputs = 2;
  uint32 output = 3; // index into the enclosing `sorts`
  // Optional static cost: a finite, closed, inert value of the handle's cost
  // sort C. Decode it structurally; never evaluate a primitive/table lookup or
  // depend on declaration installation order. PrimitiveValue payloads encode
  // base/container data directly. Absent leaves the model's fallback policy
  // in control.
  optional uint32 cost = 4; // index into the enclosing `nodes`

  bool unextractable = 5;
}

// A concrete table-backed function.
message Function {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated Arg inputs = 2;
  uint32 output = 3; // index into the enclosing `sorts`

  // Deferred code bound only over old and new, including in an exported
  // declaration. Absent asserts equality on conflict.
  optional uint32 merge = 4; // index into the enclosing `nodes`
}

// A concrete set of tuples, inserted by an action call and matched by row existence.
// The declaration has no output field; typed calls have implicit sort Unit.
// It has no merge body and is not a valid `Set` target.
message Relation {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated Arg inputs = 2;
}

// A concrete program-defined computed function, distinct from HostPrimitive.
// Its body and transitive callees must be legal at every
// use, using host-published ambient capabilities; the receiver checks this.
// An expression-only body may still write through Union. No effect-inference
// algorithm or fallback for recursive definitions is prescribed here.
message Primitive {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated Arg inputs = 2;
  uint32 output = 3; // index into the enclosing `sorts`
  // Deferred code bound only over _0, _1, ... for the inputs in declaration
  // order, including in an exported declaration.
  optional uint32 body = 4 [(buf.validate.field).required = true]; // index into the enclosing `nodes`
}

// A named host sort family, including nullary scalar sorts. Names are immutable;
// compatible resends agree on arity. Every application uses HostSort, including
// arity-zero families. No generic user equality
// sorts or implementation/codec code are declared by this descriptor.
message HostSortFamily {
  option (buf.validate.message).cel = {
    id: "host_sort_family.presentation_parameters"
    message: "explicit presentation type-parameter labels must match family arity"
    expression:
      "!has(this.bindings) || [this.bindings.python, this.bindings.rust].all(m, "
      "size(m.type_params) == 0 || uint(size(m.type_params)) == this.arity)"
  };

  string name = 1 [(buf.validate.field).string.min_len = 1];
  uint32 arity = 2;
  SortBindings bindings = 3;
}

// A host-implemented callable. Submission asserts that a compatible native
// implementation is available; it supplies neither a body nor executable code.
message HostPrimitive {
  string name = 1 [(buf.validate.field).string.min_len = 1];

  oneof typing {
    option (buf.validate.oneof).required = true;

    GenericSignature signature = 2;
    FunctionApplication application = 3;
  }
}

// An ordinary host signature: a fixed prefix followed by zero or more
// repetitions of the ordered varargs pattern. An empty pattern means no tail
// (exact fixed arity); one Arg describes homogeneous varargs. For a nonempty
// pattern, the actual argument count minus the fixed prefix must be a multiple
// of the pattern width. Pattern order and width are semantic, even [T, T];
// arguments remain flat, with no tuple/group node. Sort indices reference
// Program.sorts.
// Sort.var indices bind by position in type_params; labels do not bind by name
// and need not be distinct. All variable uses, including nested HostSort and
// FuncSort patterns, must be in this signature's binder. Each actual call
// matches all concrete argument and result sorts structurally to obtain one
// consistent, complete substitution across all repetitions and the result.
// Reject undetermined parameters: e.g.
// count<T>(...T)->i64 cannot be called with zero arguments, whereas an empty
// vec-of<T>(...T)->Vec<T> determines T from its concrete result sort.
// No conversion, subtyping, overload search or heterogeneous type packs.
message GenericSignature {
  repeated string type_params = 1;
  repeated Arg inputs = 2;
  optional uint32 output = 3 [(buf.validate.field).required = true];
  repeated Arg varargs = 4;
}

// Dedicated typing for a named application primitive, still invoked by Call.
// The first effective argument must have a concrete FuncSort; the remaining
// arguments exactly match its params, and the call result matches its result.
// PrimitiveValue.partial_call supplies an effective complete call; see that field.
message FunctionApplication {}

// ---------------------------------------------------------------------------
// LANGUAGE BINDINGS — optional views, never additional core definitions.
// ---------------------------------------------------------------------------

// Each language block is fixed when first supplied for the semantic definition.
// Absence makes no assertion/removal; another language may first arrive later.
// Reconcile all supplies order-independently, including repeated same-name
// declarations, before interning away duplicate presentations.
// Agreeing supplies are allowed; conflicting supplies are errors. Compare
// arena references structurally, not by index. Sort comparison excludes attached
// bindings; default calls identify their core callee, not its presentation.
// Compare all default roots within each language block together, preserving
// shared/distinct Union topology.
// Bindings never change semantic definition identity or duplicate docs/spans.
//
// Without a Python/Rust block, generators derive conservative type/free-function
// wrappers, preserving exact core names, signatures and argument order. Derived
// wrappers install no bindings. Empty blocks carry no hiding instruction; their
// generation behavior and identifier normalization are not specified here.
// Malformed individual bindings and conflicting resupply are installation errors.
// Cross-definition Python/Rust binding collisions are generation errors for all
// explicit/derived combinations, never silent fallback, overwrite or renaming.
// High-level generators and these runtime checks remain unimplemented.
message SortBindings {
  TypeBinding python = 1;
  TypeBinding rust = 2;
  EgglogTypeBinding egglog = 3;
}

// A target-language type path (module/crate segments, then type name), distinct
// from its core sort/family name. Parameters remain in core family order.
// Optional labels name those parameters; if supplied, their count equals arity.
// They introduce no Sort.var binder. Nullary EqSort/families have no parameters.
message TypeBinding {
  repeated string path = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
  repeated string type_params = 2 [(buf.validate.field).repeated.items.string.min_len = 1];
}

// Surface sort/family symbol; family parameters retain core order.
message EgglogTypeBinding {
  string symbol = 1;
}

// The same per-language lifetime/compatibility contract as SortBindings.
// No view changes the core signature. A surface call supplies every core input
// exactly once after receiver mapping, defaults and tail expansion; it emits an
// ordinary Call in core argument order. Parameter names are surface names, not
// binders for defaults. Views of generic host primitives share that signature's
// type binder for owner/trait sort patterns; other views have no type binder.
// Presentation cannot rescue a core call whose generic substitution is not
// determined by its concrete argument/result sorts under the usual call rules.
// Recursive binder/owner/default typing checks are normative.
message CallableBindings {
  PythonBindings python = 1;
  RustBindings rust = 2;
  EgglogBindings egglog = 3;
}

// Owner identity, not a display path. A sort pattern refers to the enclosing
// callable's signature binder, or must be closed when it has no generic binder.
// The function marker is only for FunctionApplication's structural function
// wrapper: receiver core input 0, with tail/result derived from its concrete
// FuncSort. It introduces neither a named sort family nor a type-pack binder.
message BindingOwner {
  oneof kind {
    option (buf.validate.oneof).required = true;

    uint32 sort = 1; // index into Program.sorts
    FunctionTypeOwner function = 2;
  }
}

message FunctionTypeOwner {}

message PythonBindings {
  repeated PythonCallable views = 1;
}

// Free functions and CONSTANT use a qualified path; members use one name on owner.
// INITIALIZER instead omits path and derives __init__.
// METHOD/PROPERTY map a real core input as receiver. INITIALIZER/CLASS_METHOD
// have no core self/cls input. Only INITIALIZER requires result = owner;
// class methods and class variables may return a different sort.
// METHOD/PROPERTY receiver sort must match owner under the same substitution.
// PROPERTY has only a receiver; CLASS_VARIABLE is a nullary expression view.
// CONSTANT is an ownerless named expression (C, not C()), backed by a nullary
// concrete core signature. It has no receiver, parameters or mutated input.
// Its path is nonempty, but its final name may be empty; qualifiers stay nonempty.
// It does not change declaration semantics or evaluate a body at installation
// or export. FUNCTION stays callable even when its core signature is nullary.
message PythonCallable {
  option (buf.validate.message).cel = {
    id: "python_callable.path_components"
    message: "only a constant's final name may be an empty path component"
    expression:
      "this.path.filter(p, p == '').size() == "
      "(this.kind == 7 && size(this.path) > 0 && this.path[size(this.path)-1] == '' ? 1 : 0)"
  };
  option (buf.validate.message).cel = {
    id: "python_callable.owner_and_receiver"
    message: "Python callable form determines owner and receiver presence"
    expression:
      "(this.kind in [1, 7] ? !has(this.owner) : has(this.owner)) && "
      "((this.kind in [3, 5]) == has(this.receiver)) && "
      "(this.kind == 2 ? size(this.path) == 0 : "
      "this.kind in [1, 7] ? size(this.path) > 0 : size(this.path) == 1) && "
      "(!(this.kind in [5, 6, 7]) || size(this.params) == 0)"
  };
  option (buf.validate.message).cel = {
    id: "python_callable.unique_inputs"
    message: "each surface parameter/receiver maps a distinct core input"
    expression:
      "this.params.all(p, (!has(this.receiver) || p.core_input != this.receiver) && "
      "this.params.filter(q, q.core_input == p.core_input).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "python_callable.mutated_input"
    message: "a mutated argument must be a mapped receiver or parameter"
    expression:
      "!has(this.mutates) || (this.kind != 2 && "
      "((has(this.receiver) && this.mutates == this.receiver) || "
      "this.params.exists(p, p.core_input == this.mutates)))"
  };

  PythonCallKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string path = 2;
  BindingOwner owner = 3;
  optional uint32 receiver = 4; // fixed core input, not implicit Python self/cls
  repeated PythonParameter params = 5; // surface order, excluding receiver

  // Replace this supplied argument wrapper with the Call result and return
  // Python None. Applies to free functions as well as methods. The fixed input
  // and core result sorts must agree; this does not change the core result to
  // Unit or assert a database effect. Initializers cannot use this convention.
  optional uint32 mutates = 6;
}

enum PythonCallKind {
  PYTHON_CALL_KIND_UNSPECIFIED = 0;
  PYTHON_CALL_KIND_FUNCTION = 1;
  PYTHON_CALL_KIND_INITIALIZER = 2;
  PYTHON_CALL_KIND_METHOD = 3;
  PYTHON_CALL_KIND_CLASS_METHOD = 4;
  PYTHON_CALL_KIND_PROPERTY = 5;
  PYTHON_CALL_KIND_CLASS_VARIABLE = 6;
  PYTHON_CALL_KIND_CONSTANT = 7;
}

// Ordered surface parameter. Fixed core inputs occupy [0, n). If the signature
// has a nonempty varargs pattern, one logical tail slot n represents the whole
// flat tail, not one slot per pattern position. It must be last in surface
// order, have no default, and cannot be a receiver. FunctionApplication has
// fixed slot 0 plus tail slot 1, whose heterogeneous sorts come from the actual FuncSort.
// No redundant varargs flag or generic expression template is introduced.
message PythonParameter {
  optional uint32 core_input = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];

  // Typed symbolic syntax, not an evaluated/captured value. It must have no
  // free/query variables; lambda-local bound variables are allowed. Calls are
  // allowed and installation/export never evaluates them. Node sorts remain
  // concrete; a default can constrain a generic call's substitution at use.
  // Check each use under its binder: sharing a node with a lambda body does
  // not bind that node in a capture or another default root.
  // Expand omitted defaults together into the emitted call with fresh Union
  // identities, preserving sharing within that expansion; no cross-call cache
  // of classes/values. Check ordinary binding, typing and effect rules at use.
  optional uint32 default_expr = 3; // index into Program.nodes
}

message RustBindings {
  repeated RustCallable views = 1;
}

// No owner means free function (qualified path); otherwise path is one member
// name. Owner without receiver is associated; with receiver it is a method.
// trait_impl selects a trait implementation, which may have either form.
// Associated-function output need not equal owner. Receiver's core sort matches
// owner; borrowing only affects wrapper ownership, not that semantic sort.
message RustCallable {
  option (buf.validate.message).cel = {
    id: "rust_callable.owner"
    message: "Rust member/trait/borrowed-Self forms require an owner"
    expression:
      "(!has(this.receiver) || has(this.owner)) && "
      "(!has(this.trait_impl) || has(this.owner)) && "
      "(!this.borrowed_self || has(this.trait_impl)) && "
      "(!has(this.owner) || size(this.path) == 1)"
  };
  option (buf.validate.message).cel = {
    id: "rust_callable.unique_inputs"
    message: "each surface parameter/receiver maps a distinct core input"
    expression:
      "this.params.all(p, (!has(this.receiver) || p.core_input != this.receiver.core_input) && "
      "this.params.filter(q, q.core_input == p.core_input).size() == 1)"
  };

  repeated string path = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  BindingOwner owner = 2;
  bool borrowed_self = 3; // impl Trait for &Owner, independent of receiver syntax
  RustReceiver receiver = 4;
  repeated RustParameter params = 5; // surface order, excluding receiver
  RustTrait trait_impl = 6;
}

// Receiver ownership relative to impl Self: self or &self. For an impl on
// &Owner, by-value self is already &Owner, while &self is &&Owner.
message RustReceiver {
  optional uint32 core_input = 1 [(buf.validate.field).required = true];
  bool borrowed = 2;
}

// Same fixed/tail input-slot convention as PythonParameter. Borrowing describes
// a fixed wrapper or the tail's elements, not a new core reference sort.
// Into/iterator conveniences remain generator policy; no host converter body.
message RustParameter {
  optional uint32 core_input = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  bool borrowed = 3;
}

// Named trait, explicit type arguments, and an optional associated output such
// as std::ops::Add<Rhs>::Output. That associated type is the core result wrapper.
// Types reuse the callable's signature binder, including mixed/concrete owner
// applications. Trait conformance/coherence is checked during Rust generation.
// Arbitrary associated types, lifetimes, const generics, mutable borrowing and
// where-clause/code payloads are not represented by this limited view.
message RustTrait {
  repeated string path = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
  repeated RustType args = 2;
  optional string output_associated_type = 3 [(buf.validate.field).string.min_len = 1];
}

message RustType {
  optional uint32 sort = 1 [(buf.validate.field).required = true]; // index into Program.sorts
  bool borrowed = 2;
}

message EgglogBindings {
  repeated EgglogCallable views = 1;
}

// Surface symbol in core argument order. datatype_member is valid only for a
// Constructor: group it under its existing equality output sort's presentation.
// It does not add a datatype definition or select a text-overload policy.
message EgglogCallable {
  string symbol = 1 [(buf.validate.field).string.min_len = 1];
  bool datatype_member = 2;
}

// ---------------------------------------------------------------------------
// RULES AND RULESETS — shared occurrences and named roots.
// ---------------------------------------------------------------------------

// An immutable ruleset occurrence: an ordered rule list or composition.
// An absent name adds no binding and leaves an unmatched occurrence anonymous.
// A present empty name denotes the default rule list.
// A present name binds this occurrence on the e-graph handle. Names are
// immutable: compatible resends retain the occurrence and all reachable
// children, including anonymous ones, with their rule state. Changes to body
// kind, ordered contents, rule definitions/options or sharing are conflicts.
// Compare expression subgraphs as in Declaration; rule labels and provenance
// are not identity.
// Frontends may build mutably before emitting a complete definition.
//
// Compare same-name presentations' bodies and internal rule/ruleset sharing
// before identifying entries. Compatible presentations identify corresponding
// ruleset occurrences, but cannot collapse distinct local rule-arena entries:
// duplicate named-root presentations must reuse the required rule indices.
// One consistent match must preserve BOTH rule and ruleset sharing across all
// named-root closures: no merging distinct occurrences or splitting shared ones.
// In particular [r,r] cannot match [s,t] by merging distinct equal rules s/t.
// Conflicting identity
// requirements from installed roots are errors.
// A matched local entry reuses its retained occurrence everywhere, including
// a direct Run of that index. Unmatched occurrences are fresh for each
// submission; equal anonymous bodies alone never imply shared state.
// Repeated references to one entry share its rule state, including across loop
// iterations in this Program.
// Named roots retain their entire reachable closure across requests; a later
// name-only reference does not need to resend those entries or their bodies.
// A resend anchored by an already-installed named parent may give a matched
// anonymous child its first name, retaining that occurrence and its rule state.
// Compare bodies and sharing before applying this new binding; names are not
// part of the child's body. Each ruleset occurrence has at most one assigned name:
// renaming an already-named occurrence, proposing two different names for one
// matched occurrence, or binding an occupied name to another occurrence is an
// error. Repeating the same compatible binding is a no-op. Omitting a matched
// child's name does not remove its installed binding. Name assignments must be
// consistent across all matches; equal anonymous bodies alone are not anchors.
// A matched rule entry reuses that retained occurrence in every referencing
// leaf, including new/unmatched leaves. No leaf owns a rule exclusively.
// Equal bodies or labels alone never establish a match. Cyclic compositions are
// invalid, including cycles through names; these are normative semantic checks.
message Ruleset {
  option (buf.validate.message).cel = {
    id: "ruleset.default_is_rule_list"
    message: "the default ruleset must be a rule list"
    expression: "!has(this.name) || this.name != '' || has(this.rules)"
  };

  optional string name = 1;

  oneof kind {
    option (buf.validate.oneof).required = true;

    RuleList rules = 2;
    CombinedRuleset combined = 3;
  }

  // Optional origin and documentation; excluded from semantic identity.
  Span span = 4;
  string doc = 5;
}

// An ordered selection of rule occurrences. May be empty or repeat an index;
// Run retains each occurrence only at its first inclusion. Different leaves
// may share entries without copying them or creating separate rule state.
message RuleList {
  repeated uint32 rules = 1 [packed = true]; // indices into Program.rules
}

// A request-local occurrence or a named binding on the e-graph handle.
// Names may be installed by this Program or an earlier one. Missing names
// and out-of-range indices are errors. An explicitly empty name selects the
// default ruleset; an unset reference does not implicitly select it.
// In RuleAttribution, indices refer to the associated request's Program,
// and names resolve on the handle used by that request.
message RulesetRef {
  oneof kind {
    option (buf.validate.oneof).required = true;

    uint32 index = 1; // index into Program.rulesets
    string name = 2;
  }
}

// A rule occurrence, or a directional/bidirectional rewrite occurrence, with
// immutable body/options and diagnostic metadata. Its Program.rules entry is
// the request-local identity, not structural equality or a label. References
// share the occurrence and its rule-owned execution state across groups/Run
// sites. This does not identify distinct scheduler instances or combine their
// scheduler-owned state.
message RuleDecl {
  oneof kind {
    option (buf.validate.oneof).required = true;

    Rule rule = 1;
    Rewrite rewrite = 2;
    BiRewrite birewrite = 3;
  }

  // Optional diagnostic label; may repeat and never binds or identifies a rule.
  // Changing/omitting it does not affect compatible occurrence matching.
  optional string name = 4 [(buf.validate.field).string.min_len = 1];

  // Required for every rule and rewrite; no implicit default.
  RuleEvalMode eval_mode = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  bool no_decomp = 6;
  bool include_subsumed = 7;

  // Origin and documentation of the whole rule/rewrite form; excluded from
  // semantic identity. The span attributes a runtime panic to this occurrence.
  Span span = 8;
  string doc = 9;
}

// A stored query and ordered action list.
message Rule {
  repeated uint32 query = 2 [packed = true]; // index into the enclosing `nodes`
  repeated Action head = 3;
}

// Rule evaluation strategies; UNSPECIFIED is invalid.
enum RuleEvalMode {
  RULE_EVAL_MODE_UNSPECIFIED = 0;

  // Delta matching. Query primitives use Pure context (no database reads or
  // writes); head primitives use Write context (writes but no database reads).
  RULE_EVAL_MODE_SEMINAIVE = 1;

  // Match the whole database each iteration. Query primitives use Read
  // context; head primitives use Full context (both database reads and writes).
  RULE_EVAL_MODE_NAIVE = 2;

  // Delta matching with the same Read/Full contexts as NAIVE. Unsafe: a head
  // read sees the database mid-iteration; changes to the value read do not
  // by themselves trigger reevaluation.
  RULE_EVAL_MODE_UNSAFE_SEMINAIVE = 3;
}

// A guarded directional rewrite, optionally subsuming its left side.
// Match lhs and conditions together in one query binder. For each match,
// evaluate rhs in that binder and unify its value with the matched lhs value.
message Rewrite {
  uint32 lhs = 2; // index into the enclosing `nodes`
  uint32 rhs = 3; // index into the enclosing `nodes`
  repeated uint32 conditions = 4 [packed = true]; // index into the enclosing `nodes`
  // Requires lhs to address a Constructor row. Functions and Relations cannot
  // be subsumed; the constructor's per-row cost is retained.
  bool subsume = 5;
}

// Two guarded rewrites: lhs -> rhs and rhs -> lhs, each with these conditions
// and its own query binder, following Rewrite's match/evaluate/unify semantics.
// Neither direction subsumes.
message BiRewrite {
  uint32 lhs = 2; // index into the enclosing `nodes`
  uint32 rhs = 3; // index into the enclosing `nodes`
  repeated uint32 conditions = 4 [packed = true]; // index into the enclosing `nodes`
}

// The composition body of a Ruleset: an ordered list of fixed child references.
// May be empty. Contains no rules directly; name and provenance belong to the
// enclosing Ruleset. Repeated/shared children retain their occurrence identity.
message CombinedRuleset {
  repeated RulesetRef rulesets = 1;
}

// ---------------------------------------------------------------------------
// COMMANDS — the `Command.kind` arms after `action`, in arm order.
// ---------------------------------------------------------------------------

// One command, at top level or in a loop body: every command may appear in
// `Repeat` or `Saturate`. Declarations are not commands.
message Command {
  oneof kind {
    option (buf.validate.oneof).required = true;

    Action action = 1;
    Check check = 2;
    Run run = 3;
    BindScheduler bind_scheduler = 4;
    KeepBest keep_best = 5;

    Extract extract = 6;
    Freeze freeze = 7;
    PrintSize print_size = 8;
    PrintFunction print_function = 9;
    PrintTableStats print_table_stats = 10;

    Repeat repeat = 11;
    Saturate saturate = 12;

    Prove prove = 14;
    ProveExists prove_exists = 15;
  }

  // Origin. Locates a failure attributed to a command rather than an
  // expression: an unknown ruleset, a failed `check`, a failed extraction.
  // Surfaces as `Error.span`.
  Span span = 13;
}

// One conjunctive query. All facts share the same variable bindings.
message Check {
  repeated uint32 facts = 1 [packed = true]; // index into the enclosing `nodes`
}

// Prove one conjunctive query with Check's typing and variable-binding rules.
// Uses the existing proof engine: this installs/runs a helper rule before proof
// extraction, so it can mutate state and fail after completing helper effects.
// PROOF_TESTING treats Check the same way. Maintenance reporting remains
// unresolved; see CommandOutput.
// Do not reject solely because proofs are disabled before running the native
// command: witness failure and completed effects follow native execution order.
message Prove {
  repeated uint32 facts = 1 [packed = true]; // index into the enclosing `nodes`
}

// Request a proof for an existing witness of this declared constructor. The
// target is a name, not an evaluated call or arguments that insert a witness.
message ProveExists {
  string constructor = 1 [(buf.validate.field).string.min_len = 1];
}

// Execute one ruleset step, optionally using a bound scheduler. A completed
// top-level Run returns RunOutcome; nested Runs contribute to their loop.
// Flatten the selected ruleset transitively in inclusion order, retaining each
// rule occurrence only at its first inclusion in this complete Run. Identity,
// not name or structural equality, determines duplication; distinct equal
// rules remain independent. This only deduplicates selection within one Run:
// separate Runs and loop iterations select independently. It does not limit
// firings from query matches or override scheduler decisions.
message Run {
  RulesetRef ruleset = 1 [(buf.validate.field).required = true];

  // Empty means no scheduler; otherwise names a `BindScheduler` instance.
  string scheduler = 2;
}

// Bind a stateful scheduler. Rebinding an in-scope name is an error.
// A binding inside a loop body expires each iteration; a top-level binding
// survives the request. Name expiry does not destroy the scheduler instance.
message BindScheduler {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  Scheduler scheduler = 2 [(buf.validate.field).required = true];
}

// Supported scheduler configurations.
message Scheduler {
  oneof kind {
    option (buf.validate.oneof).required = true;

    BackOff back_off = 1;
  }
}

// Back-off limits. Absent fields select engine defaults; zero is explicit.
message BackOff {
  optional uint64 match_limit = 1; // engine default 1000
  optional uint64 ban_length = 2; // engine default 5
  optional uint64 node_limit = 3; // no default; unset means unbounded
}

// Extract each cell of the named tables, then clear ALL tables, including
// tables not named here. Reinstall the selected rows and any constructor rows
// needed to represent their extracted values. Produces no output.
// Preserve assigned costs, including absence versus zero, from selected source
// constructor rows onto corresponding reconstructed rows. This includes named
// table rows and nested extracted producers. Never substitute extraction totals
// or declared/model defaults. Preserve/remap cost values and needed data for
// the full sort C, including class references, across the internal clear.
// Discarded rows lose annotations; static declaration costs remain unchanged.
// Reconstruction/canonicalization collisions retain existing merge-new rules.
// With the same options and no intervening changes, desired repeat stability
// is semantic, not byte/index identity. This is neither an enforced API
// precondition nor a universal guarantee; no model/extractor restriction is added.
message KeepBest {
  repeated string tables = 1 [
    packed = false,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  Extractor extractor = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Host-registered model name, subject to Extract's C/algorithm compatibility.
  // Empty requests the host default, which need not support every C.
  string cost_model = 3;
}

// Extract ordered roots using the selected algorithm and host cost model.
// Returns `ExtractResult`; a root with no finite extraction has an empty
// variants list, which is a successful result.
message Extract {
  // Ordered roots.
  repeated uint32 roots = 1 [
    packed = true,
    (buf.validate.field).repeated.min_items = 1
  ]; // index into the enclosing `nodes`

  // Literal maximum variants per root; one requests the best result.
  uint32 variants = 2 [(buf.validate.field).uint32.gte = 1];

  Extractor extractor = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Host-registered name, not serialized callback code. Empty selects the
  // host default. The model must support the handle's cost sort C and selected
  // algorithm, or Extract/KeepBest fails. The host defines arithmetic, order,
  // NaN and overflow policies; there is no automatic domain adapter or promise
  // of a default model for every C. A handle cannot switch to a model returning
  // a different sort; choose C at creation. No implicit numeric casts occur.
  string cost_model = 4;
}

// Extraction algorithms; UNSPECIFIED is invalid.
enum Extractor {
  EXTRACTOR_UNSPECIFIED = 0;
  EXTRACTOR_TREE = 1;
  EXTRACTOR_GREEDY_DAG = 2;
}

// Export complete logical options and a reconstruction Program; no filtering.
// Returns CommandOutput.snapshot; its Program owns nodes, sorts and source files.
// This is current state, not request history or an engine checkpoint: omit
// scheduler instances, execution cursors, caches, reports, proof history and
// host resources. Preserve execution_mode, but reconstruction does not preserve
// original derivations or promise equivalent proof results.
//
// Include every installed declaration and sort, even unused or empty tables;
// every installed named ruleset and its retained closure, preserving occurrence
// sharing and assigned ruleset names; and all builtin
// declaration descriptors, including generic families and every distinct core
// callable. Export each retained rule and ruleset occurrence once, even if
// multiple roots/leaves reach it. Remap RuleList indices into exported rules,
// preserving shared and distinct rule occurrences independently of labels.
// Omit transient rules/rulesets not retained through named roots.
// Include saved code and its dependencies without executing it.
// Include supplied language bindings and all bindings-only sort/default-node
// dependencies, remapping their arena references. Do not export derived wrapper
// defaults as if they were supplied bindings. Preserve default-root Union
// sharing without evaluating templates or confusing them with stored classes.
// Host implementations/codecs remain external.
// HostSortFamily and HostPrimitive describe the catalog, including generic
// signatures, presentation patterns and all referenced sorts. These graphs may
// contain Sort.var; the reconstruction data and concrete definitions may not.
// Host binding and export remain unimplemented; never silently omit definitions.
//
// Return EGraphSnapshot with the handle's logical options and this Program.
// Do not export resource settings such as threads. See EGraphSnapshot for
// fresh-handle restoration with compatible C and host capabilities. Definition
// installation follows Program's normal rules; scheduler/seminaive history
// is not resumed.
//
// The export's commands are one ordered list of ordinary Actions, with no
// queries, Runs, loops or other commands. Emit exactly one direct Action.term
// for each canonical equality class, naming its unique Union location whose
// members are all its constructor rows. Include empty/unreachable classes.
// Emit relation rows as direct Action.term Calls; write every function row,
// including Unit outputs, with Set. Then emit SetCost annotations, then subsume
// for subsumed constructor rows; no delete or panic actions.
// These explicit roots inventory stored classes, not arbitrary arena nodes or
// Union locations in saved code. Shared Union locations preserve references
// across this list. Keep all canonical rows and extant cost/subsumption
// annotations. A row is its typed callee and canonical arguments, not a Call
// node's identity. Each constructor/relation row has one inventory occurrence;
// each function/cost key is written once. A canonical export restored into empty
// data must not depend on replaying conflict merges.
//
// Exported values use exact PrimitiveValue payloads and shared class references,
// not primitive calls, function lookups or extraction. Lambda bodies and saved
// definitions remain deferred code; captures, partial arguments, custom args
// and costs preserve their references. Generic inspection never evaluates
// these actions or materializes custom values. Executing them is explicit
// trusted materialization and requires the appropriate host codecs.
// If any required state/definition/value cannot be represented,
// Freeze fails with EVALUATION_FAILED instead of returning a partial export.
// Export completeness, canonical keys and reference preservation are normative
// obligations, not established by Program's local CEL checks.
message Freeze {}

// Report sizes of selected tables, or all visible tables. Returns
// `TableSizes`.
message PrintSize {
  // Empty selects all visible tables.
  repeated string tables = 1 [
    packed = false,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// Rows of one table as extracted representative terms, including subsumed
// rows. Alternative producers and e-class identity are not preserved. Returns
// `PrintedFunction` only if every cell of every selected row has a finite
// extraction. Otherwise the whole command fails with EXTRACTION_FAILED: no
// partial PrintedFunction is emitted, earlier outputs/effects remain, and
// later commands do not run. Unselected rows do not affect this requirement.
message PrintFunction {
  string table = 1 [(buf.validate.field).string.min_len = 1];
  // Zero selects every row.
  uint64 max_rows = 2;
}

// Report structural statistics for selected tables, or all visible tables.
// Returns `TableStatsResult`.
message PrintTableStats {
  // Empty selects all visible tables.
  repeated string tables = 1 [
    packed = false,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// Execute `body` exactly `times` times, unless `until` matches or execution
// fails. Does not stop early when the database is unchanged. A completed
// top-level Repeat returns LoopOutcome.
message Repeat {
  repeated Command body = 1;

  // Conjunctive pre-check before each iteration. Empty means no condition.
  repeated uint32 until = 2 [packed = true]; // index into the enclosing `nodes`

  // Required; an explicit zero performs no iterations.
  optional uint64 times = 3 [(buf.validate.field).required = true];
}

// Repeat `body` until a complete iteration can stop, or a bound or `until`
// condition ends it. Stop only when the iteration made no changes and every
// consulted scheduler permits stopping. An unbounded body may diverge.
// A completed top-level Saturate returns LoopOutcome.
//
// Progress is recomputed each iteration over every mutation in the body:
// actions, `keep_best`, extraction-root evaluation, and nested loops. Row
// counts alone do not detect changes. A nested loop contributes its whole run
// to the parent iteration, not only its final no-op step.
message Saturate {
  repeated Command body = 1;

  // Conjunctive pre-check, as on `Repeat`.
  repeated uint32 until = 2 [packed = true]; // index into the enclosing `nodes`

  // Absent means unbounded; reaching a bound is not proof of saturation.
  optional uint64 max_iterations = 3 [(buf.validate.field).uint64.gte = 1];
}

// ---------------------------------------------------------------------------
// SERVICE — the operations, their request/response types, and failure.
// ---------------------------------------------------------------------------

// E-graph lifecycle, runtime resources, and program execution. Logical
// operations compose inside a `Program`, rather than one rpc per command.
// Intended for an in-process typed/bytes adapter; no network transport is
// required. The bounded compatibility adapter implements only part of this
// contract; unsupported operations must fail explicitly.
service EgglogService {
  rpc CreateEGraph(CreateEGraphRequest) returns (CreateEGraphResponse);
  rpc CloneEGraph(CloneEGraphRequest) returns (CloneEGraphResponse);
  rpc DestroyEGraph(DestroyEGraphRequest) returns (DestroyEGraphResponse);
  rpc ConfigureEGraphResources(ConfigureEGraphResourcesRequest) returns (ConfigureEGraphResourcesResponse);
  rpc RunProgram(RunProgramRequest) returns (RunProgramResponse);
}

// Immutable logical settings, shared by creation and snapshots. cost_sort
// indexes CreateEGraphRequest.sorts or EGraphSnapshot.program.sorts respectively.
// C may be any supported, acyclic, recursively closed sort, including a custom
// equality sort or a host-family/function type. Frontends may offer an i64
// default, but the wire always specifies C. No value codec or extraction model
// is required merely to select C. Costs in executed Programs and responses must
// agree with C structurally, never by comparing arena-local indices.
message EGraphOptions {
  optional uint32 cost_sort = 1 [(buf.validate.field).required = true];

  // Select before executing user declarations. Host providers must be installed
  // before term encoding captures their typechecking/validation environment.
  ExecutionMode execution_mode = 2 [(buf.validate.field).enum.defined_only = true];
}

// Existing engine treatments; NORMAL is the default when the field is absent.
enum ExecutionMode {
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  EXECUTION_MODE_NORMAL = 0;
  // Instrument terms without generating proofs.
  EXECUTION_MODE_TERM_ENCODING = 1;
  // Generate proofs for explicit Prove and ProveExists requests.
  EXECUTION_MODE_PROOFS = 2;
  // Generate proofs and execute each Check as Prove.
  EXECUTION_MODE_PROOF_TESTING = 3;
}

// Create an empty e-graph without executing a Program. Resolve the sort-only
// declarations against ambient host definitions, then validate options and this
// acyclic, recursively closed sort arena before allocating a handle. Equality
// declarations allow custom C without an already-existing handle. Compatible
// repeated definitions are allowed; conflicting arity/bindings within a
// namespace are errors. EqSort and HostSortFamily may have the same name.
// Successful creation retains these sort declarations on the new handle, so
// later Programs may reference their names without resending definitions.
// Unsupported options/resources are lifecycle errors, not RunProgram.error.
message CreateEGraphRequest {
  option (buf.validate.message).cel = {
    id: "create_egraph_request.closed_sorts"
    message: "creation sorts cannot contain signature variables"
    expression: "this.sorts.all(s, !has(s.var))"
  };
  option (buf.validate.message).cel = {
    id: "create_egraph_request.cost_sort_in_range"
    message: "options.cost_sort must index sorts"
    expression: "has(this.options.cost_sort) && this.options.cost_sort < uint(size(this.sorts))"
  };
  option (buf.validate.message).cel = {
    id: "create_egraph_request.sort_refs_in_range"
    message: "sort children must index sorts"
    expression:
      "this.sorts.all(s, "
      "(has(s.family) ? s.family.args : "
      "has(s.func) ? s.func.params + [s.func.result] : [])"
      ".all(i, i < uint(size(this.sorts))))"
  };
  option (buf.validate.message).cel = {
    id: "create_egraph_request.sort_declarations_only"
    message: "creation accepts only equality-sort and host sort-family declarations"
    expression: "this.declarations.all(d, has(d.eq_sort) || has(d.host_sort_family))"
  };
  option (buf.validate.message).cel = {
    id: "create_egraph_request.sort_declarations"
    message: "same-name host-family declarations must agree on arity"
    expression:
      "this.declarations.all(d, !has(d.host_sort_family) || "
      "this.declarations.all(e, !has(e.host_sort_family) || "
      "d.host_sort_family.name != e.host_sort_family.name || "
      "d.host_sort_family.arity == e.host_sort_family.arity))"
  };
  option (buf.validate.message).cel = {
    id: "create_egraph_request.sort_uses"
    message: "host-family applications must agree with declared family arities"
    expression:
      "this.declarations.all(d, !has(d.host_sort_family) || "
      "this.sorts.all(s, !has(s.family) || s.family.name != d.host_sort_family.name || "
      "uint(size(s.family.args)) == d.host_sort_family.arity))"
  };

  repeated Sort sorts = 1;
  EGraphOptions options = 2 [(buf.validate.field).required = true];
  repeated SourceFile files = 3;
  repeated Declaration declarations = 4;

  // Resource request, never exported as logical state. Absent leaves policy to
  // the receiver; zero requests automatic parallelism; positive requests that
  // thread count. Reject unsupported requests rather than silently ignoring.
  optional uint32 threads = 5;
}

message CreateEGraphResponse {
  uint64 egraph_id = 1;
}

// Portable logical state, not an execution checkpoint. The Program owns all
// arenas/files, including the C selected by options. Only C's reachable sort
// graph must be closed; unrelated generic signature patterns may remain.
// Restore by remapping C's closed sort graph and needed sort declarations into
// a CreateEGraphRequest, selecting receiver resource settings, then executing
// program normally on the fresh compatible handle. No creation-time commands
// or resumed scheduler/seminaive state are implied. Executing program against
// an existing handle still has ordinary Program semantics; callers must check
// option compatibility for any restoration equivalence claim.
message EGraphSnapshot {
  option (buf.validate.message).cel = {
    id: "egraph_snapshot.cost_sort_in_range"
    message: "options.cost_sort must index a non-variable sort in program"
    expression:
      "has(this.options.cost_sort) && this.options.cost_sort < uint(size(this.program.sorts)) && "
      "!has(this.program.sorts[int(this.options.cost_sort)].var)"
  };

  EGraphOptions options = 1 [(buf.validate.field).required = true];
  Program program = 2 [(buf.validate.field).required = true];
}

// Clone the addressed e-graph, retaining C, execution mode and proof state.
// No complexity guarantee.
message CloneEGraphRequest {
  uint64 egraph_id = 1;
}

message CloneEGraphResponse {
  uint64 egraph_id = 1;
}

// Destroy the addressed e-graph.
message DestroyEGraphRequest {
  uint64 egraph_id = 1;
}

message DestroyEGraphResponse {}

// Query or update runtime resources on an existing handle, never logical
// settings or Program state. Completed updates affect subsequent calls; they
// do not reconfigure an in-flight Run. Clone inherits effective resources and
// later updates are handle-local. Resources are not part of a frozen snapshot.
//
// Reject malformed, missing/unknown operations, invalid handles and unsupported
// requests before changing resources or execution state. In particular, an
// update must not reset rule cursors or otherwise act like cloning/restoration.
// Resource allocation failures retain the receiver's native failure boundary;
// this contract does not require native allocation panics to be recoverable.
message ConfigureEGraphResourcesRequest {
  uint64 egraph_id = 1;

  oneof operation {
    option (buf.validate.oneof).required = true;

    // Observe the current effective settings without changing them.
    Unit query = 2;
    // Zero requests automatic parallelism resolved at this update; positive
    // requests that exact count. Unsupported requests fail, never clamp or
    // silently succeed. This has the same request domain as creation. An
    // explicit operation distinguishes query from setting automatic zero.
    uint32 threads = 3;
  }
}

message ConfigureEGraphResourcesResponse {
  // Actual effective native count after query/update, never the requested zero
  // or a frontend estimate. uint64 accommodates the receiver's native count
  // without narrowing to the uint32 request domain.
  uint64 threads = 1 [(buf.validate.field).uint64.gte = 1];
}

// Execute a program against an existing e-graph.
message RunProgramRequest {
  uint64 egraph_id = 1;
  Program program = 2;

  // Off by default and scoped to this request. False disables optional profile
  // collection/retention, not just serialization. Scheduler-required counters,
  // progress and stopping checks remain. Outcomes and requested observations
  // are independent of this flag. Collection-off needs runtime implementation.
  bool profile = 3;
}

// Results have their own concrete arenas, independent of the request. Nested
// exported Programs own separate arenas and may contain signature patterns.
message RunProgramResponse {
  option (buf.validate.message).cel = {
    id: "run_program_response.closed_sorts"
    message: "response sorts cannot contain signature variables"
    expression: "this.sorts.all(s, !has(s.var))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.node_sort_in_range"
    message: "every node sort_id must index sorts"
    expression: "this.nodes.all(n, n.sort_id < uint(size(this.sorts)))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.node_refs_in_range"
    message: "node children must index nodes"
    expression:
      "this.nodes.all(n, "
      "(has(n.call) ? n.call.args : "
      "has(n.get_cost) ? n.get_cost.args : "
      "has(n.union) ? n.union.members : "
      "has(n.primitive_value) ? [n.primitive_value].map(v, "
      "has(v.lambda) ? v.lambda.captures + [v.lambda.body] : "
      "has(v.partial_call) ? v.partial_call.args : "
      "has(v.vec) ? v.vec.items : has(v.set) ? v.set.items : "
      "has(v.multiset) ? v.multiset.items : "
      "has(v.map) ? v.map.entries.map(e, e.key) + v.map.entries.map(e, e.value) : "
      "has(v.pair) ? [v.pair.first, v.pair.second] : "
      "has(v.maybe) && has(v.maybe.value) ? [v.maybe.value] : "
      "has(v.custom) ? v.custom.args : [])[0] : [])"
      ".all(i, i < uint(size(this.nodes))))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.sort_refs_in_range"
    message: "sort children must index sorts"
    expression:
      "this.sorts.all(s, "
      "(has(s.family) ? s.family.args : "
      "has(s.func) ? s.func.params + [s.func.result] : [])"
      ".all(i, i < uint(size(this.sorts))))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.function_value_signature"
    message: "function values require a function sort"
    expression:
      "this.nodes.all(n, !(has(n.primitive_value.lambda) || has(n.primitive_value.partial_call)) || "
      "(n.sort_id < uint(size(this.sorts)) && has(this.sorts[int(n.sort_id)].func)))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.empty_union_eq_sort"
    message: "an empty union requires an equality sort"
    expression:
      "this.nodes.all(n, !has(n.union) || size(n.union.members) > 0 || "
      "(n.sort_id < uint(size(this.sorts)) && has(this.sorts[int(n.sort_id)].eq)))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.table_output_refs_in_range"
    message: "printed cells and column sorts must index the response arenas"
    expression:
      "this.outputs.all(o, "
      "(!has(o.printed_function) || o.printed_function.rows.all(r, "
      "(r.args + [r.output]).all(i, i < uint(size(this.nodes))))) && "
      "(!has(o.table_stats) || o.table_stats.stats.all(t, "
      "t.columns.all(c, c.sort < uint(size(this.sorts))))))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.rule_refs_in_range"
    message: "error and profile rule references must index response rules"
    expression:
      "(!has(this.error) || !has(this.error.rule) || this.error.rule < uint(size(this.rules))) && "
      "(!has(this.profile) || this.profile.runs.all(s, "
      "s.rules.all(r, r.rule < uint(size(this.rules)))))"
  };
  option (buf.validate.message).cel = {
    id: "run_program_response.profile_completion"
    message: "a present profile is complete exactly when the request succeeded"
    expression: "!has(this.profile) || this.profile.complete == !has(this.error)"
  };

  repeated Node nodes = 1;
  repeated Sort sorts = 2;

  // Completion order. Each completed TOP-LEVEL Run/Repeat/Saturate contributes
  // one compact outcome; nested control commands contribute none. Every
  // requested observation contributes its output, including repeated executions
  // inside loops. Successful proof requests contribute their proof. Native
  // maintenance outputs and their profiling attribution remain unresolved;
  // see CommandOutput.
  repeated CommandOutput outputs = 3;

  // Origins for this response's nodes, sorts, rules and errors, including
  // installed definitions from earlier requests. Exported Programs own files.
  repeated SourceFile files = 4;

  // Absent on success. Present means execution stopped; `outputs` contains
  // completed outputs, and every entry is valid. A failed loop has
  // no outcome, but observations completed within it remain here.
  Error error = 5;

  // Only occurrence identities referenced by error/profile, not global IDs or
  // definition copies. Shared occurrences reuse one index; distinct equal
  // occurrences have distinct indices even when diagnostics coincide. Include
  // attribution needed by an error even when profile collection is off;
  // otherwise an off response has no catalog entries.
  repeated RuleAttribution rules = 6;

  // Present iff requested, including when no Run was entered or validation
  // failed. Summary only: no dynamic iteration coordinates or event history.
  ProfileSummary profile = 7;
}

// One authored RuleDecl occurrence, including both directions of a BiRewrite.
// Pick one valid route from the request's ruleset arena or an installed named
// root, following composition-child positions (and resolving their refs), to
// a leaf RuleList. `rule` is a position in that leaf, NOT a Program.rules index;
// the selected entry resolves to its rule occurrence. This also locates retained
// rules/leaves absent from the request. A rule shared by multiple leaves or
// repeated positions still has one response-local catalog entry.
// Bounds, name resolution and terminal-leaf checks are normative. Multiple
// routes to the same occurrence do not create additional catalog entries.
message RuleAttribution {
  RulesetRef root = 1 [(buf.validate.field).required = true];
  repeated uint32 children = 2;
  uint32 rule = 3; // ordinal within the selected RuleList

  // A supplied diagnostic label from this occurrence, absent if it has none.
  // Representative provenance only, never an invented or lookup identity.
  optional string name = 4 [(buf.validate.field).string.min_len = 1];
  Span span = 5;
}

// One dynamic command execution in the submitted Program. path[0] indexes
// Program.commands; each later component indexes the previous Repeat/Saturate
// command's body. iterations gives the zero-based iteration of each enclosing
// loop, outermost first. It does not include the target loop's own iteration.
// Bounds and command kinds are checked against the request, not this response.
message CommandLocation {
  option (buf.validate.message).cel = {
    id: "command_location.iteration_depth"
    message: "one iteration coordinate is required per enclosing loop"
    expression: "size(this.path) == size(this.iterations) + 1"
  };

  repeated uint32 path = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated uint64 iterations = 2;
}

// A failure that ended the program. Effects completed before it are retained —
// there is no rollback — and no later command runs; a caller needing
// transactionality clones the e-graph first.
//
// Engine failures only. A decode fault, an unknown method and an unknown
// `egraph_id` are transport faults and never appear here.
//
// Source and command locators are independent: a rule expression can supply
// the span while its executing Run supplies the command location.
message Error {
  option (buf.validate.message).cel = {
    id: "error.proof_failure"
    message: "proof failure details are required exactly for PROOF_FAILED"
    expression: "has(this.proof_failure) == (this.code == 7)"
  };

  ErrorCode code = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Engine text, formatted for humans. NEVER parsed; wording is not contract.
  string message = 2 [(buf.validate.field).string.min_len = 1];

  // Most specific known user-source origin: failing expression, then Action,
  // then rule; fall back to the active command's span. Absent if none is known,
  // never represented by a fabricated zero offset.
  Span span = 3;

  // Innermost active command, not its enclosing top-level loop. A failure in
  // a loop's own pre-check locates that loop, with only its enclosing iteration
  // coordinates. Absent when the failure precedes command execution.
  CommandLocation location = 4;

  // Supplied structurally for an attributed rule/rewrite failure, never parsed
  // from message text. Presence is independent of profile collection.
  optional uint32 rule = 5; // index into RunProgramResponse.rules

  // Engine-internal origin as `file:line:col`; empty when there is none.
  // Diagnostic only, and not a `Span`: `Span.file` indexes USER source.
  string engine_origin = 6;

  // Native runtime proof failure, supplied structurally, never parsed from text.
  // Earlier parsing/typechecking failures retain their ordinary error class.
  ProofFailure proof_failure = 7;
}

// Failure classes: one value per class of remedy, not one per engine error.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // Malformed or ill-typed program; nothing ran.
  ERROR_CODE_INVALID_PROGRAM = 1;

  // A `check` did not hold.
  ERROR_CODE_CHECK_FAILED = 2;

  // An authored `panic` action fired.
  ERROR_CODE_PANIC = 3;

  // A primitive or merge failed at run time, including unresolvable merges,
  // a directly evaluated get_cost has no assigned annotation, or Freeze cannot
  // encode a required value with a supported codec.
  ERROR_CODE_EVALUATION_FAILED = 4;

  // The requested extractor/cost-model pair is incompatible, or an operation
  // requiring a finite representative (KeepBest or PrintFunction) cannot
  // obtain one.
  // Extract instead returns empty variants when a root has no finite term.
  ERROR_CODE_EXTRACTION_FAILED = 5;

  // A named ruleset, scheduler, table or cost model does not exist.
  ERROR_CODE_UNKNOWN_NAME = 6;

  // A proof request failed; proof_failure distinguishes its native cause.
  ERROR_CODE_PROOF_FAILED = 7;
}

// Causes from the current engine's ProveExistsError, not proof-checker verdicts.
message ProofFailure {
  ProofFailureReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Present when supplied by the native failure, such as a missing witness.
  optional string constructor = 2 [(buf.validate.field).string.min_len = 1];
}

enum ProofFailureReason {
  PROOF_FAILURE_REASON_UNSPECIFIED = 0;
  PROOF_FAILURE_REASON_REQUIRES_CONSTRUCTOR = 1;
  PROOF_FAILURE_REASON_PRIMITIVES_UNSUPPORTED = 2;
  PROOF_FAILURE_REASON_QUERY_DID_NOT_MATCH = 3;
  PROOF_FAILURE_REASON_PROOFS_NOT_ENABLED = 4;
}

// ---------------------------------------------------------------------------
// COMMAND OUTPUTS — the `CommandOutput.kind` arms, in arm order.
// ---------------------------------------------------------------------------

// For authored commands, completed top-level controls return compact outcomes;
// observations return their matching arm at every nesting depth. Actions,
// ordinary checks, scheduler bindings, and keep_best have no requested output.
// Successful Prove/ProveExists and PROOF_TESTING Check return a proof at their
// own location. These requested outputs must match the located command. Nested
// authored control outcomes are folded, never appended here.
// Native maintenance Run emission, output locations and optional profiling
// attribution remain unresolved. CEL permits nested Run payloads as structural
// capacity, not an emission requirement; request/output matching remains an
// adapter obligation.
// Execution errors are `RunProgramResponse.error`, not an arm here.
message CommandOutput {
  option (buf.validate.message).cel = {
    id: "command_output.top_level_loop_outcome"
    message: "loop outcomes are only emitted for top-level commands"
    expression: "!has(this.loop) || size(this.location.path) == 1"
  };

  oneof kind {
    option (buf.validate.oneof).required = true;

    RunOutcome run = 1;
    ExtractResult extraction = 2;
    EGraphSnapshot snapshot = 3;
    TableSizes sizes = 4;
    PrintedFunction printed_function = 5;
    TableStatsResult table_stats = 6;
    LoopOutcome loop = 8;
    ProofResult proof = 9;
  }

  CommandLocation location = 7 [(buf.validate.field).required = true];
}

// An inert export of the existing engine's checked/simplified proof. These
// arenas belong only to this result, not to the response's typed Node arena.
// IDs are remapped local indices, never native TermId/ProofId or live handles.
// Retain shared subterms/subproofs and premise order; export only the closure
// reachable from root through proof premises, propositions and substitutions.
// Both graphs must be acyclic. CEL checks direct presence/oneofs/bounds only:
// shared decoders must check cycles and reachability with bounded-stack graph
// traversal before exposing the result. Producers also traverse iteratively
// and range-check index conversion; arbitrary arena order is allowed.
// This is a certificate relative to the original program and its compatible
// host validators/normalizers. They are not serialized, and this message does
// not define a new checker or imply standalone proof validity from CEL checks.
message ProofResult {
  option (buf.validate.message).cel = {
    id: "proof_result.root_in_range"
    message: "root must index proofs"
    expression: "has(this.root) && this.root < uint(size(this.proofs))"
  };
  option (buf.validate.message).cel = {
    id: "proof_result.term_refs_in_range"
    message: "term children, propositions and substitutions must index terms"
    expression:
      "this.terms.all(t, !has(t.app) || t.app.children.all(i, i < uint(size(this.terms)))) && "
      "this.proofs.all(p, [p.lhs, p.rhs].all(i, i < uint(size(this.terms))) && "
      "(!has(p.rule) || p.rule.substitution.all(b, b.term < uint(size(this.terms)))))"
  };
  option (buf.validate.message).cel = {
    id: "proof_result.proof_refs_in_range"
    message: "justification premises must index proofs"
    expression:
      "this.proofs.all(p, "
      "(has(p.rule) ? p.rule.premise_proofs : "
      "has(p.merge_fn) ? [p.merge_fn.old_proof, p.merge_fn.new_proof] : "
      "has(p.trans) ? [p.trans.left, p.trans.right] : "
      "has(p.sym) ? [p.sym] : "
      "has(p.congr) ? [p.congr.proof, p.congr.child_proof] : "
      "has(p.container_normalize) ? [p.container_normalize] : [])"
      ".all(i, i < uint(size(this.proofs))))"
  };

  repeated ProofTerm terms = 1;
  repeated ProofStep proofs = 2;
  optional uint32 root = 3 [(buf.validate.field).required = true];
}

// The native TermDag syntax, without invented sorts or executable call typing.
// A function-row proposition may include both inputs and output as children.
message ProofTerm {
  oneof kind {
    option (buf.validate.oneof).required = true;

    int64 i64 = 1;
    // Preserve all IEEE-754 bits, including signed zero and NaN payloads.
    fixed64 f64_bits = 2;
    string string = 3;
    bool bool = 4;
    Unit unit = 5;
    string var = 6;
    ProofApp app = 7;
  }
}

message ProofApp {
  string head = 1;
  repeated uint32 children = 2 [packed = true]; // indices into ProofResult.terms
}

// One proposition lhs = rhs paired with exactly one native justification.
// This is not general reflexivity: native Fiat justifies asserted terms and
// primitive reflexive equalities; arbitrary t = t is not assumed.
message ProofStep {
  optional uint32 lhs = 1 [(buf.validate.field).required = true];
  optional uint32 rhs = 2 [(buf.validate.field).required = true];

  oneof justification {
    option (buf.validate.oneof).required = true;

    Unit fiat = 3;
    ProofRule rule = 4;
    ProofMergeFn merge_fn = 5;
    ProofTrans trans = 6;
    uint32 sym = 7; // proof index
    ProofCongr congr = 8;
    uint32 container_normalize = 9; // proof index; native checker normalizes rhs
    // Placeholder for a container side condition re-evaluated against its rule
    // body by the native checker. Its proposition proves nothing on its own.
    Unit eval = 10;
  }
}

message ProofRule {
  option (buf.validate.message).cel = {
    id: "proof_rule.unique_substitution"
    message: "substitution variable names must be unique"
    expression: "this.substitution.all(b, this.substitution.filter(c, c.name == b.name).size() == 1)"
  };

  string name = 1;
  repeated uint32 premise_proofs = 2 [packed = true]; // indices into ProofResult.proofs
  // Emit in name order for deterministic encoding. Names identify native rule
  // variables; values index ProofResult.terms. No duplicate keys are allowed.
  repeated ProofBinding substitution = 3;
}

message ProofBinding {
  string name = 1;
  optional uint32 term = 2 [(buf.validate.field).required = true];
}

message ProofMergeFn {
  string function = 1;
  optional uint32 old_proof = 2 [(buf.validate.field).required = true];
  optional uint32 new_proof = 3 [(buf.validate.field).required = true];
}

message ProofTrans {
  optional uint32 left = 1 [(buf.validate.field).required = true];
  optional uint32 right = 2 [(buf.validate.field).required = true];
}

// The first proof's rhs must be an application; child_index addresses one of
// its children, and child_proof proves its replacement. Term shape/child bounds
// and proposition agreement are semantic proof checks, not CEL validation.
message ProofCongr {
  optional uint32 proof = 1 [(buf.validate.field).required = true];
  optional uint32 child_index = 2 [(buf.validate.field).required = true];
  optional uint32 child_proof = 3 [(buf.validate.field).required = true];
}

// One completed run, independent of optional profiling.
message RunOutcome {
  option (buf.validate.message).cel = {
    id: "run_outcome.can_stop"
    message: "a Run that updated the database cannot also permit stopping"
    expression: "!this.updated || !this.can_stop"
  };

  bool updated = 1;

  // This Run made no changes and its scheduler, if any, permits stopping.
  // Does not by itself prove saturation under a resource-limited scheduler.
  bool can_stop = 2;
}

// One completed Repeat/Saturate, including zero-body-execution completion.
// No historical can_stop aggregate: termination states why this loop ended.
message LoopOutcome {
  option (buf.validate.message).cel = {
    id: "loop_outcome.zero_iterations"
    message: "zero iterations cannot update data or establish saturation"
    expression:
      "this.iterations > 0 || (!this.updated && "
      "this.termination in [2, 4])"
  };

  bool updated = 1; // any mutation across the whole loop, including nested work
  uint64 iterations = 2; // completed executions of this loop's body

  optional TerminationReason termination = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// Why a loop ended. Execution failure is not a reason here; it is reported as
// `RunProgramResponse.error`.
enum TerminationReason {
  TERMINATION_REASON_UNSPECIFIED = 0;

  // A complete body iteration made no progress and left no deferred work
  // requiring another.
  TERMINATION_REASON_SATURATED = 1;

  // Repeat completed its count; does not imply saturation.
  TERMINATION_REASON_COUNT_REACHED = 2;

  // Saturate exhausted its bound before proving saturation.
  TERMINATION_REASON_ITERATION_LIMIT = 3;

  // The until query matched at a pre-check.
  TERMINATION_REASON_UNTIL_MATCHED = 4;

  // A scheduler permitted stopping under its OWN resource policy while rules
  // still had applicable matches. Not saturation: more work would change the
  // database. NORMATIVE: if a loop would otherwise report SATURATED after a
  // no-progress iteration with scheduler permission to stop, but cannot rule
  // out a consulted scheduler's resource limit, report this value instead.
  // This does not override COUNT_REACHED, ITERATION_LIMIT, or UNTIL_MATCHED.
  TERMINATION_REASON_SCHEDULER_LIMIT = 5;
}

// One table's row count.
message TableSize {
  string table = 1;
  uint64 rows = 2;
}

// Aggregate coverage of this request, not a trace. Complete iff the whole
// request succeeded; false includes work observed before failure, including
// a failing Run. Exactly one entry per entered static Run site; no unentered
// site appears. Completion says nothing about availability of individual
// optional metrics. No collection budget/truncation is defined here.
// Native maintenance attribution is unresolved; see CommandOutput.
// Per-iteration histories are deferred.
message ProfileSummary {
  option (buf.validate.message).cel = {
    id: "profile_summary.unique_sites"
    message: "each static Run site has one aggregate"
    expression: "this.runs.all(r, this.runs.filter(s, s.command_path == r.command_path).size() == 1)"
  };

  bool complete = 1;
  repeated RunSummary runs = 2;
}

// All invocations of one static authored Run command, across enclosing loop
// iterations. Path uses CommandLocation.path without dynamic coordinates; the
// site resolves to that Run command. Native maintenance attribution remains
// unresolved; see CommandOutput. Each selected occurrence contributes once per
// Run's selection, not once per group membership; BiRewrite directions share
// one authored occurrence. No nested-loop or ruleset totals duplicate this work.
// Optional metrics total the observed work across these invocations. Omit a
// total if any required measurement is unavailable or cannot be faithfully
// attributed; do not serialize only its known subset.
// Present zero means measured zero, never unavailable. Per-rule timing is a
// breakdown of Run timing, not additional elapsed time to add to it. These
// phase measurements need not partition wall time; no total elapsed is given.
message RunSummary {
  option (buf.validate.message).cel = {
    id: "run_summary.unique_rules"
    message: "each rule occurrence has one aggregate per Run site"
    expression: "this.rules.all(r, this.rules.filter(s, s.rule == r.rule).size() == 1)"
  };

  repeated uint32 command_path = 1 [(buf.validate.field).repeated.min_items = 1];
  optional uint64 search_and_apply_nanos = 2;
  optional uint64 merge_nanos = 3;
  optional uint64 rebuild_nanos = 4;
  repeated RuleSummary rules = 5;
  uint64 invocations = 6 [(buf.validate.field).uint64.gte = 1]; // entered Runs, including a failing final invocation
}

// Statistics for one response-local authored occurrence at one static Run site.
// Both BiRewrite directions and internal decomposition contribute here only
// when the engine can attribute the measurement faithfully to that occurrence.
// Otherwise leave it absent rather than fabricating a count or timing.
message RuleSummary {
  optional uint32 rule = 1 [(buf.validate.field).required = true]; // index into RunProgramResponse.rules

  // Observed complete source-query matches, not changed rows or internal
  // decomposition matches. Does not count potential matches beyond a limit.
  optional uint64 matches = 2;
  optional uint64 search_and_apply_nanos = 3;
}

// One result per requested root, in request order.
message ExtractResult {
  repeated ExtractedRoot roots = 1;
}

// Variants ranked best first, up to the requested count. Empty means there
// is no finite extraction, not an error.
message ExtractedRoot {
  repeated ExtractedTerm variants = 1;
}

// One extracted variant; its sort is carried by its response-arena node.
// The term and any cost are finite, closed data, with no `Union` class groups
// in data positions. Lambda bodies are separately scoped code.
message ExtractedTerm {
  uint32 term = 1; // index into `RunProgramResponse.nodes`

  // The cost as INERT VALUE DATA, using PrimitiveValue payloads,
  // never an expression to evaluate. Its sort is the handle's C;
  // there is no promotion from i64 to BigInt or other implicit domain change.
  // Select its representation/host codec by sort_id and RunProgramResponse.sorts.
  //
  // This field is the ENCODING only. The comparison, combination and identity
  // of a cost domain belong to the host's `cost_model`, not this wire value.
  //
  // A cost domain with no codec has no portable form here. Absent means NO
  // PORTABLE COST, which is not a cost of zero and not "free"; a caller must be
  // able to tell an unencodable cost from an encoded zero.
  optional uint32 cost = 2; // index into `RunProgramResponse.nodes`
}

// Named table sizes.
message TableSizes {
  repeated TableSize sizes = 1;
}

// Fully extracted selected rows from one successful PrintFunction command.
message PrintedFunction {
  string table = 1;
  repeated FunctionRow rows = 2;
}

// One extracted table row. A relation row's output is `PrimitiveValue.unit`.
// Every argument and output has finite extraction; an unavailable cell makes
// the entire PrintFunction command fail instead of omitting or marking a row.
// The enclosing PrintedFunction.table identifies the table. Cells are ordinary
// values, not a synthetic row-position Call or a re-evaluated table lookup.
message FunctionRow {
  repeated uint32 args = 1 [packed = true]; // indices into `RunProgramResponse.nodes`
  uint32 output = 2; // index into `RunProgramResponse.nodes`
  bool subsumed = 3;
}

// Per-table statistics.
message TableStatsResult {
  repeated TableStats stats = 1;
}

// Per-column statistics in input declaration order, then output (Unit for a
// relation). PairOutDegree indices address this columns list.
message TableStats {
  string table = 1;
  uint64 rows = 2;
  repeated ColumnStats columns = 3;
  repeated PairOutDegree out_degrees = 5;
}

// Exact column type and its distinct-value count; no textual type reconstruction.
message ColumnStats {
  uint32 sort = 1; // index into `RunProgramResponse.sorts`
  uint64 distinct_count = 2;
}

// Every ordered pair of distinct columns, plus output -> combined inputs
// for tables with at least two input columns.
message PairOutDegree {
  repeated uint32 source = 1 [packed = true]; // column index
  repeated uint32 target = 2 [packed = true]; // column index
  OutDegreeStats stats = 3;
}

// Out-degree distribution statistics.
message OutDegreeStats {
  uint64 min = 1;
  uint64 max = 2;
  double mean = 3;
  double p25 = 4;
  double median = 5;
  double p75 = 6;
}
