[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "egglog-proto"
version = "0.1.0"
description = "Generated messages for the Egglog protobuf IR"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE.protovalidate"]
dependencies = ["protobuf-py>=0.5.0,<0.6"]

[tool.setuptools]
packages = [
    "egglog_proto",
    "egglog_proto.egglog",
    "egglog_proto.egglog.v1",
    "egglog_proto.buf",
    "egglog_proto.buf.validate",
]
package-dir = { egglog_proto = "." }
include-package-data = false

[tool.setuptools.package-data]
egglog_proto = ["py.typed"]
