name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
    - uses: actions/checkout@v3
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - uses: Swatinem/rust-cache@v2
    - run: make test
  nits:
    runs-on: ubuntu-latest
    steps:
    - run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
    - uses: actions/checkout@v3
    - uses: Swatinem/rust-cache@v2
    - run: make nits
  proto:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: taiki-e/install-action@v2
      with:
        tool: uv, protoc-gen-prost@0.5.0
    - uses: bufbuild/buf-action@v1
      with:
        setup_only: true
        pr_comment: false
    - run: make proto-lint proto-test
    - run: cargo check --manifest-path gen/rust/Cargo.toml
